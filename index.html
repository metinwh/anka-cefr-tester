<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ANKA CEFR Tester — Nektar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,500;1,9..144,600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Painterly watercolor palette — ported from Claude Design TC_A */
      --phone-bg:     #fbf3e3;
      --art-bg:       #e8dfcd;
      --ink:          #1d1a14;
      --muted:        rgba(29,26,20,0.6);
      --accent:       #b84408;
      --accent-hot:   #f06f18;
      --panel-bg:     rgba(255,255,255,0.78);
      --panel-border: rgba(184,68,8,0.12);
      --border-color: rgba(29,26,20,0.10);
      --error:        #b94a2a;

      --safe-top:     env(safe-area-inset-top, 0px);
      --safe-bottom:  env(safe-area-inset-bottom, 0px);

      --font-sans:    "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-serif:   "Fraunces", Georgia, "Times New Roman", serif;
      --font-display: "Bricolage Grotesque", "DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }
    body {
      background: var(--phone-bg);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      color: inherit;
    }

    /* ── Keyframes ─────────────────────────────────────────── */
    @keyframes fadeUp     { from { opacity: 0; transform: translateY(13px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeDown   { from { opacity: 0; transform: translateY(-9px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes screenIn   { from { opacity: 0; transform: translateY(14px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes wordIn     { from { opacity: 0; transform: translateY(20px); filter: blur(3px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
    @keyframes cursorBlink{ 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes dotPulse   { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.6); } }
    @keyframes choiceIn   { from { opacity: 0; transform: translateX(-9px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes glowPulse  {
      0%, 100% { box-shadow: 0 5px 20px rgba(184,68,8,0.32); }
      50%      { box-shadow: 0 6px 32px rgba(184,68,8,0.55), 0 0 0 6px rgba(184,68,8,0.09); }
    }
    @keyframes dropExpand { from { opacity: 0; transform: translateY(-4px); max-height: 0; } to { opacity: 1; transform: translateY(0); max-height: 240px; } }
    @keyframes penDraw    { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }
    @keyframes slideUp    { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes triDot     { 0%, 100% { opacity: 0.25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    /* ── Watercolor backdrop (fixed, fills viewport) ────────── */
    .watercolor-bg {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      transition: opacity 300ms ease;
    }
    .watercolor-grain {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      mix-blend-mode: multiply;
      opacity: 0.55;
      transition: opacity 300ms ease;
    }
    body.solid-bg .watercolor-bg { opacity: 0; }
    body.solid-bg .watercolor-grain { opacity: 0; }

    /* ── Layout ────────────────────────────────────────────── */
    .layout {
      position: relative;
      z-index: 1;
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 0 22px calc(24px + var(--safe-bottom));
      padding-top: calc(28px + var(--safe-top));
    }

    .screen-stage {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* exit animation when swapping screens */
    .screen-stage.exiting > .screen-content {
      opacity: 0;
      transform: translateY(-8px) scale(0.985);
    }
    .screen-content {
      display: flex;
      flex-direction: column;
      transition: opacity 200ms ease, transform 200ms cubic-bezier(0.22,1,0.36,1);
    }

    /* ── Topbar (logo + chip) ───────────────────────────────── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 22px;
      animation: fadeDown 420ms cubic-bezier(0.22,1,0.36,1) 60ms both;
    }
    .nektar-logo {
      height: 36px; width: auto; display: block;
      filter: brightness(0) sepia(1) saturate(4) hue-rotate(352deg);
      opacity: 0.82;
    }
    .nektar-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px 5px 8px;
      border-radius: 999px;
      background: rgba(184,68,8,0.055);
      border: 1px solid rgba(184,68,8,0.165);
      color: var(--accent);
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.09em;
    }
    .nektar-chip .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent);
      animation: dotPulse 2s ease infinite;
    }

    /* ── Welcome ───────────────────────────────────────────── */
    .welcome {
      display: flex; flex-direction: column;
      gap: 4px;
    }
    .eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      color: rgba(184,68,8,0.75); text-transform: uppercase;
      margin-bottom: 10px;
      animation: fadeUp 380ms ease 140ms both;
    }
    .hero-title {
      font-family: var(--font-display);
      font-size: 44px; line-height: 0.95;
      font-weight: 800; color: var(--ink);
      letter-spacing: -0.035em;
      margin-bottom: 10px;
    }
    .hero-word {
      display: inline-block;
      margin-right: 10px;
      position: relative;
      animation: wordIn 460ms cubic-bezier(0.22,1,0.36,1) both;
    }
    .hero-word:last-child { margin-right: 0; }
    .hero-word.accent {
      color: var(--accent);
      font-style: italic;
    }
    .hero-brush {
      position: absolute;
      left: -3%;
      bottom: -6px;
      width: 108%;
      height: 16px;
      pointer-events: none;
    }
    .tagline {
      font-size: 15px; line-height: 1.55;
      color: rgba(29,26,20,0.78);
      margin-top: 8px;
      margin-bottom: 12px;
      animation: fadeUp 380ms ease 380ms both;
    }
    .typing-cursor {
      display: inline-block; width: 2px; height: 1.05em;
      margin-left: 2px; border-radius: 1px;
      background: var(--accent);
      vertical-align: -0.12em;
      animation: cursorBlink 500ms steps(1,end) infinite;
    }

    /* ── Info dropdowns ────────────────────────────────────── */
    .info-stack {
      display: flex; flex-direction: column; gap: 7px;
      animation: fadeUp 440ms cubic-bezier(0.22,1,0.36,1) 700ms both;
    }
    .info-drop {
      border-radius: 12px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      overflow: hidden;
      transition: border-color 200ms ease;
    }
    .info-drop.open {
      border-color: rgba(184,68,8,0.25);
    }
    .info-toggle {
      width: 100%;
      display: grid; grid-template-columns: 36px 1fr 16px;
      gap: 10px; align-items: center;
      padding: 9px 12px;
      background: transparent;
      color: var(--ink);
      text-align: left;
    }
    .info-icon {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: 10px;
      background: rgba(184,68,8,0.07);
      border: 1px solid rgba(184,68,8,0.16);
      color: var(--accent);
    }
    .info-icon svg { display: block; }
    .info-label {
      font-size: 12.5px; line-height: 1.4; font-weight: 600;
      color: var(--ink);
    }
    .info-chev {
      display: inline-flex; align-items: center; justify-content: center;
      transition: transform 220ms cubic-bezier(0.22,1,0.36,1);
      color: var(--accent);
    }
    .info-drop.open .info-chev { transform: rotate(180deg); }
    .info-body {
      padding: 2px 14px 13px 62px;
      font-size: 12.5px; line-height: 1.5;
      color: var(--muted);
      font-family: var(--font-serif);
      font-style: italic;
      animation: dropExpand 220ms cubic-bezier(0.22,1,0.36,1) both;
    }

    /* ── Primary CTA ───────────────────────────────────────── */
    .primary {
      margin-top: 12px;
      min-height: 52px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hot));
      color: #fff;
      font-size: 15px; font-weight: 700; letter-spacing: 0.01em;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 0 18px;
    }
    .welcome .primary {
      animation: fadeUp 400ms ease 880ms both, glowPulse 3s ease-in-out 1280ms infinite;
    }
    .primary:active { transform: scale(0.99); }
    .primary:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ── Question screen ───────────────────────────────────── */
    .question-screen {
      display: flex; flex-direction: column; gap: 12px;
      padding-top: 4px;
      min-height: 520px;
      animation: screenIn 320ms cubic-bezier(0.22,1,0.36,1) both;
    }
    .q-topline {
      display: flex; align-items: center; justify-content: space-between;
    }
    .confidence-pill {
      display: inline-flex; align-items: center; gap: 0;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(184,68,8,0.18);
    }
    .confidence-pill .label {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px;
      background: rgba(184,68,8,0.07);
      color: var(--accent);
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em;
    }
    .confidence-pill .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent);
      animation: dotPulse 2s ease infinite;
    }
    .confidence-pill .value {
      padding: 5px 10px;
      background: var(--accent);
      color: #fff;
      font-size: 11px; font-weight: 800;
    }
    .boundary-tag {
      font-size: 9.5px; font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    .progress-rail {
      height: 4px;
      border-radius: 999px;
      background: rgba(29,26,20,0.06);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: inherit;
      background: var(--accent);
      transition: width 600ms cubic-bezier(0.22,1,0.36,1);
    }
    .instruction {
      font-size: 12px; font-style: italic;
      color: var(--muted);
    }
    .prompt-card {
      padding: 22px 22px;
      border-radius: 14px;
      background: var(--panel-bg);
      border: 1px solid rgba(184,68,8,0.13);
      border-left: 4px solid var(--accent);
      font-family: var(--font-serif);
      font-size: 21px; line-height: 1.4; font-weight: 500;
      color: var(--ink);
      min-height: 108px;
      box-shadow: 0 6px 18px rgba(184,68,8,0.05);
    }
    .prompt-card .typing-live::after {
      content: "";
      display: inline-block;
      width: 2px; height: 1.05em;
      margin-left: 2px; border-radius: 1px;
      background: var(--accent);
      vertical-align: -0.12em;
      animation: cursorBlink 500ms steps(1,end) infinite;
    }
    .prompt-card .typing-live:not(.typing)::after { display: none; }
    .prompt-card strong { color: var(--accent); font-weight: 700; }
    .prompt-ghost { display: none; }

    .choices {
      display: flex; flex-direction: column; gap: 8px;
    }
    .choice {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 12px; align-items: center;
      text-align: left;
      padding: 14px;
      border-radius: 12px;
      min-height: 58px;
      border: 1.5px solid var(--border-color);
      background: var(--panel-bg);
      color: var(--ink);
      transition: all 180ms ease;
      animation: choiceIn 280ms cubic-bezier(0.22,1,0.36,1) both;
    }
    .choice .letter {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: rgba(184,68,8,0.08);
      color: var(--accent);
      font-family: var(--font-serif);
      font-size: 13px; font-weight: 600;
      border: 1px solid rgba(184,68,8,0.13);
      transition: all 180ms ease;
    }
    .choice .choice-text {
      font-size: 15.5px; font-weight: 500;
    }
    .choice.selected {
      border-color: var(--accent);
      background: rgba(184,68,8,0.07);
      transform: scale(0.99);
    }
    .choice.selected .letter {
      background: var(--accent);
      color: #fff;
    }

    .unknown-btn {
      padding: 11px;
      border-radius: 11px;
      border: 1.5px solid var(--border-color);
      background: transparent;
      color: var(--muted);
      font-size: 13px; font-weight: 600;
      animation: choiceIn 280ms ease 700ms both;
    }
    .unknown-btn:disabled { opacity: 0.5; }

    .cancel-row {
      margin-top: auto;
      padding-top: 12px;
      display: flex; justify-content: center;
    }
    .cancel-btn {
      color: var(--error);
      border: 1px solid rgba(185,74,42,0.3);
      border-radius: 10px;
      min-height: 34px;
      padding: 0 22px;
      font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em;
      background: transparent;
    }

    /* ── Transition ────────────────────────────────────────── */
    .transition-screen {
      padding: 100px 0 40px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 24px;
      text-align: center;
      min-height: 300px;
      animation: screenIn 280ms cubic-bezier(0.22,1,0.36,1) both;
    }
    .transition-pen svg path {
      stroke-dasharray: 200;
      animation: penDraw 1.4s ease-in-out infinite;
    }
    .transition-text {
      max-width: 24ch;
      font-family: var(--font-serif);
      font-size: 22px; line-height: 1.25;
      font-weight: 500; color: var(--ink);
      animation: fadeUp 320ms ease 120ms both;
    }
    .transition-sub {
      font-size: 12px;
      color: rgba(29,26,20,0.6);
      font-style: italic;
      animation: fadeUp 320ms ease 220ms both;
    }

    /* ── Result ────────────────────────────────────────────── */
    .result-screen {
      display: flex; flex-direction: column; gap: 14px;
      padding-top: 4px;
      animation: screenIn 360ms cubic-bezier(0.22,1,0.36,1) both;
    }
    .result-eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      animation: fadeUp 400ms ease 80ms both;
    }
    .level-glyph {
      font-family: var(--font-serif);
      font-size: 108px; line-height: 0.92;
      font-weight: 600; color: var(--accent);
      letter-spacing: -0.01em;
      animation: fadeUp 480ms cubic-bezier(0.22,1,0.36,1) 180ms both;
    }
    .level-rule {
      width: 56px; height: 3px;
      background: var(--accent);
      border-radius: 2px;
      margin-top: -4px;
      animation: fadeUp 400ms ease 280ms both;
    }
    .result-screen p {
      font-size: 14.5px; line-height: 1.55;
      color: var(--muted);
      margin-top: 4px;
      animation: fadeUp 400ms ease 320ms both;
    }
    .result-caveat {
      margin-top: 4px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(184,68,8,0.06);
      border-left: 3px solid var(--accent);
      font-size: 13px; line-height: 1.5;
      color: var(--ink);
      font-style: italic;
      animation: fadeUp 400ms ease 380ms both;
    }
    .result-caveat strong { font-style: normal; font-weight: 700; color: var(--accent); }

    .feedback-card {
      margin-top: 4px;
      padding: 16px;
      border-radius: 13px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      display: flex; flex-direction: column; gap: 10px;
      animation: fadeUp 400ms ease 460ms both;
    }
    .feedback-q {
      font-family: var(--font-serif);
      font-size: 15px; font-weight: 500;
      color: var(--ink); line-height: 1.35;
    }
    .feedback-opts {
      display: flex; flex-direction: column; gap: 6px;
    }
    .feedback-opt {
      padding: 10px 12px;
      border-radius: 9px;
      border: 1.5px solid var(--border-color);
      background: #fff;
      color: var(--ink);
      font-size: 13px; font-weight: 500;
      text-align: left;
      transition: all 160ms ease;
    }
    .feedback-opt.selected {
      border-color: var(--accent);
      background: rgba(184,68,8,0.06);
      color: var(--accent);
      font-weight: 600;
    }
    .feedback-label {
      font-size: 12px; color: var(--muted);
      font-style: italic; margin-top: 2px;
    }
    .feedback-input {
      width: 100%; min-height: 64px;
      padding: 10px 12px;
      border-radius: 9px;
      border: 1.5px solid var(--border-color);
      background: #fff;
      color: var(--ink);
      font: inherit; font-size: 13px; line-height: 1.5;
      resize: none; outline: none;
    }
    .feedback-input:focus {
      border-color: rgba(184,68,8,0.35);
    }
    .feedback-submit {
      min-height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hot));
      color: #fff;
      font-size: 13px; font-weight: 700;
    }
    .feedback-submit:disabled { opacity: 0.55; cursor: not-allowed; }
    .feedback-status {
      font-size: 11px;
      color: var(--muted);
      font-family: SFMono-Regular, Consolas, Menlo, monospace;
      letter-spacing: 0.02em;
      min-height: 14px;
    }
    .feedback-status.ok  { color: #3f7a3c; }
    .feedback-status.err { color: var(--error); }
    .feedback-card.submitted .feedback-opt,
    .feedback-card.submitted .feedback-input,
    .feedback-card.submitted .feedback-submit { opacity: 0.6; pointer-events: none; }

    .restart-btn {
      margin-top: auto;
      min-height: 50px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hot));
      color: #fff;
      font-size: 15px; font-weight: 700;
      animation: fadeUp 400ms ease 600ms both;
    }

    .log-status-line {
      margin-top: 6px;
      font-size: 11px;
      color: rgba(29,26,20,0.35);
      font-family: SFMono-Regular, Consolas, Menlo, monospace;
      letter-spacing: 0.02em;
    }

    /* ── Trajectory toggle pill (sticky) ───────────────────── */
    .traj-pill-wrap {
      display: flex; justify-content: center;
      pointer-events: none;
      z-index: 50;
      padding: 18px 0 6px;
    }
    .traj-pill {
      pointer-events: all;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px 6px 11px;
      border-radius: 999px;
      background: rgba(251,243,227,0.94);
      border: 1px solid var(--border-color);
      color: var(--muted);
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.05em;
      box-shadow: 0 2px 12px rgba(29,26,20,0.18);
      backdrop-filter: blur(8px);
      white-space: nowrap;
      transition: all 200ms ease;
    }
    .traj-pill.open {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .traj-pill .count {
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      padding: 1px 6px;
      font-size: 9px; font-weight: 800;
      margin-left: 2px;
    }
    .traj-pill.open .count {
      background: rgba(255,255,255,0.28);
    }
    .traj-pill svg { flex-shrink: 0; }

    /* ── Trajectory slide-up panel ─────────────────────────── */
    .traj-overlay {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-height: 62dvh;
      display: none;
      flex-direction: column;
      background: rgba(251,243,227,0.97);
      border-top: 2px solid var(--accent);
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -8px 32px rgba(29,26,20,0.14);
      z-index: 40;
      animation: slideUp 280ms cubic-bezier(0.22,1,0.36,1) both;
      backdrop-filter: blur(8px);
    }
    .traj-overlay.visible { display: flex; }
    .traj-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 18px 10px;
      border-bottom: 1px solid rgba(184,68,8,0.1);
    }
    .traj-title {
      font-family: var(--font-display);
      font-size: 11px; font-weight: 800; color: var(--ink);
      letter-spacing: 0.09em; text-transform: uppercase;
    }
    .traj-turns {
      font-size: 10px; font-weight: 700;
      color: var(--accent);
      padding: 2px 9px; border-radius: 999px;
      background: rgba(184,68,8,0.07);
      border: 1px solid rgba(184,68,8,0.16);
    }
    .traj-list {
      overflow-y: auto;
      padding: 10px 14px calc(24px + var(--safe-bottom));
      display: flex; flex-direction: column; gap: 7px;
    }
    .traj-empty {
      text-align: center;
      padding: 22px 0;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 13px;
      color: var(--muted);
    }
    .traj-row {
      padding: 10px 12px;
      border-radius: 11px;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(184,68,8,0.08);
      animation: fadeUp 280ms cubic-bezier(0.22,1,0.36,1) both;
      display: flex; flex-direction: column; gap: 6px;
    }
    .traj-r1 { display: flex; align-items: center; gap: 6px; }
    .traj-turn-bubble {
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(184,68,8,0.08);
      border: 1px solid rgba(184,68,8,0.16);
      display: grid; place-items: center; flex-shrink: 0;
      font-family: var(--font-serif);
      font-size: 10px; font-weight: 600;
      color: var(--accent);

    .traj-action-code {
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.04em;
      color: var(--accent);
      padding: 2px 7px; border-radius: 5px;
      background: rgba(184,68,8,0.07);
      border: 1px solid rgba(184,68,8,0.13);
      font-family: SFMono-Regular, Menlo, monospace;
    }
    .traj-tag {
      font-size: 9px; font-weight: 700;
      color: rgba(29,26,20,0.4);
      padding: 2px 6px; border-radius: 4px;
      background: rgba(29,26,20,0.05);
      font-family: SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.04em;
    }
    .traj-ms {
      margin-left: auto;
      font-size: 9px;
      color: rgba(29,26,20,0.32);
      font-family: SFMono-Regular, Menlo, monospace;
    }
    .traj-r2 {
      display: flex; align-items: center; gap: 6px;
      padding-left: 26px;
      flex-wrap: wrap;
    }
    .traj-boundary {
      font-size: 9px; font-weight: 700; letter-spacing: 0.07em;
      color: var(--accent);
      text-transform: uppercase;
      padding: 1px 6px; border-radius: 4px;
      background: rgba(184,68,8,0.06);
    }
    .traj-role {
      font-size: 9px; font-weight: 600;
      color: rgba(29,26,20,0.45);
      padding: 1px 6px; border-radius: 4px;
      background: rgba(29,26,20,0.05);
      letter-spacing: 0.04em;
    }
    .traj-selected {
      font-size: 11px; color: var(--muted);
      font-weight: 500;
    }
    .traj-selected em { font-style: italic; }
    .traj-r3 {
      padding-left: 26px;
      font-size: 11px;
      color: rgba(29,26,20,0.45);
      font-family: var(--font-serif);
      font-style: italic;
      line-height: 1.3;
    }

    .traj-backdrop {
      position: fixed; inset: 0;
      background: rgba(29,26,20,0.08);
      z-index: 39;
      display: none;
      animation: fadeUp 200ms ease both;
    }
    .traj-backdrop.visible { display: block; }

    /* ── Mobile tweaks ─────────────────────────────────────── */
    @media (max-width: 380px) {
      .layout { padding: calc(24px + var(--safe-top)) 16px calc(58px + var(--safe-bottom)); }
      .hero-title { font-size: 38px; }
      .level-glyph { font-size: 92px; }
      .prompt-card { font-size: 19px; padding: 18px 18px; }
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       PAINTERLY WATERCOLOR BACKDROP (Claude Design TC_A)
       SVG with feTurbulence/feDisplacementMap — fills viewport.
       ═══════════════════════════════════════════════════════ -->
  <svg class="watercolor-bg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <filter id="paint-a" x="-25%" y="-25%" width="150%" height="150%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="5"/>
        <feDisplacementMap in="SourceGraphic" scale="48"/>
      </filter>
      <filter id="paint-b" x="-25%" y="-25%" width="150%" height="150%">
        <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="11"/>
        <feDisplacementMap in="SourceGraphic" scale="36"/>
      </filter>
    </defs>
    <g style="mix-blend-mode: multiply;">
      <ellipse cx="60"  cy="130" rx="175" ry="135" fill="#ff9961" opacity="0.55" filter="url(#paint-a)"/>
      <ellipse cx="320" cy="110" rx="155" ry="115" fill="#f0c068" opacity="0.55" filter="url(#paint-b)"/>
      <ellipse cx="60"  cy="480" rx="200" ry="160" fill="#ff8576" opacity="0.40" filter="url(#paint-a)"/>
      <ellipse cx="340" cy="660" rx="200" ry="160" fill="#ffaa6e" opacity="0.48" filter="url(#paint-b)"/>
      <ellipse cx="140" cy="780" rx="175" ry="135" fill="#f5be60" opacity="0.45" filter="url(#paint-a)"/>
    </g>
  </svg>
  <svg class="watercolor-grain" viewBox="0 0 200 200" preserveAspectRatio="none" aria-hidden="true">
    <filter id="grain-a">
      <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" stitchTiles="stitch" seed="2"/>
      <feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.4 0"/>
    </filter>
    <rect width="200" height="200" filter="url(#grain-a)"/>
  </svg>

  <!-- ═══════════════════════════════════════════════════════
       LAYOUT — single column, max 460, centered.
       ═══════════════════════════════════════════════════════ -->
  <div class="layout">

    <!-- Topbar (logo + chip) — always visible -->
    <div class="topbar">
      <img class="nektar-logo" src="./loading_dark.png" alt="Nektar">
      <div class="nektar-chip"><span class="dot"></span>NEKTAR · ANKA</div>
    </div>

    <!-- Stage — render() rewrites this -->
    <div class="screen-stage" id="screen-stage">
      <div class="screen-content" id="screen-content"></div>
    </div>

    <!-- Sticky trajectory pill -->
    <div class="traj-pill-wrap">
      <button class="traj-pill" id="traj-toggle" type="button" aria-label="Trajectory">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="3" width="12" height="10" rx="1.5"/>
          <polyline points="5 7 7 9 5 11"/>
          <line x1="9" y1="11" x2="11" y2="11"/>
        </svg>
        <span id="traj-label">KAYIT DEFTERİNİ GÖSTER</span>
        <span class="count" id="traj-count" style="display:none;">0</span>
      </button>
    </div>
  </div>

  <!-- Trajectory overlay (slide-up) -->
  <div class="traj-backdrop" id="traj-backdrop"></div>
  <div class="traj-overlay" id="traj-overlay" aria-hidden="true">
    <div class="traj-head">
      <span class="traj-title">TRAJECTORY</span>
      <span class="traj-turns" id="traj-turns">0 turns</span>
    </div>
    <div class="traj-list" id="traj-list">
      <div class="traj-empty">Henüz veri yok.</div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       ENGINE + CONTENT — script tags resolve relative paths.
       ═══════════════════════════════════════════════════════ -->
  <script src="./placement-questions.js"></script>
  <script src="./placement-pool.generated.js"></script>
  <script src="./placement-questions-v2.js"></script>
  <script src="./schema-validator.js"></script>
  <script src="./legacy-retirement.js"></script>
  <script src="./ceiling-probe-engine.js"></script>

  <script>
    // ════════════════════════════════════════════════════════════════════
    // ANKA student app — Claude Design port (v19)
    // Keeps every piece of engine + logging wiring; only the renderer changed.
    // ════════════════════════════════════════════════════════════════════

    const Engine    = window.NektarCeilingProbeEngine;
    const content   = window.NEKTAR_PLACEMENT_CONTENT;
    const contentV2 = window.NEKTAR_PLACEMENT_CONTENT_V2;
    const stage     = document.getElementById("screen-stage");
    const stageBody = document.getElementById("screen-content");

    // ─── Trajectory overlay handles ─────────────────────────────────────
    const trajToggle   = document.getElementById("traj-toggle");
    const trajLabel    = document.getElementById("traj-label");
    const trajCount    = document.getElementById("traj-count");
    const trajOverlay  = document.getElementById("traj-overlay");
    const trajBackdrop = document.getElementById("traj-backdrop");
    const trajTurns    = document.getElementById("traj-turns");
    const trajList     = document.getElementById("traj-list");
    let trajOpen = false;

    function setTrajOpen(open) {
      trajOpen = open;
      trajOverlay.classList.toggle("visible", open);
      trajBackdrop.classList.toggle("visible", open);
      trajToggle.classList.toggle("open", open);
      trajOverlay.setAttribute("aria-hidden", open ? "false" : "true");
      trajLabel.textContent = open ? "KAYIT DEFTERİNİ GİZLE" : "KAYIT DEFTERİNİ GÖSTER";
    }
    trajToggle.addEventListener("click", () => setTrajOpen(!trajOpen));
    trajBackdrop.addEventListener("click", () => setTrajOpen(false));

    // ─── Engine plumbing (unchanged) ────────────────────────────────────
    const LEGACY_CORE_EXCLUDED = new Set([
      "function", "pragmatic_choice", "natural_speech", "spoken_chunk"
    ]);

    const TRANSITION_COPY = [
      "Cevabın kaydedildi.",
      "Bir sonraki soruyu seçiyorum.",
      "Bir sonraki sorunun zorluğunu ayarlıyorum.",
      "Hmm... sıradaki maddeyi hazırlıyorum.",
      "Tamam, şimdi sonraki soruya geçiyoruz.",
      "Kısa bir kontrol daha yapıyorum.",
      "Akışı cevabına göre güncelliyorum.",
      "Sıradaki soru hazırlanıyor.",
      "Bir sonraki maddeyi seçiyorum.",
      "Sonucunu netleştirmek için devam ediyoruz."
    ];

    let engine             = null;
    let shownAt            = 0;
    let transition         = null;
    let transitionTimer    = null;
    let promptTypingTimer  = null;
    let taglineTypingTimer = null;
    let openInfo           = -1;        // welcome screen dropdown index
    let sessionStartedAt   = null;
    let loggedSessionIds   = new Set();

    // Bump on every meaningful client change so we can correlate sessions
    // to client builds in the admin logs.
    const LOG_BUILD    = "v20-2026-05-16-ui-engine-polish";
    const LOG_ENDPOINT = "/api/record";
    let lastLogStatus = "waiting";

    function seed() {
      const s = new URLSearchParams(location.search).get("seed");
      return s || `anka-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function start(mode = "standard") {
      clearTimer();
      engine = Engine.createEngine(coreItems(), {
        seed: seed(),
        mode,
        startBoundary: "A1/A2",
        standardMinItems: 12,
        detailedMinItems: 16,
        maxItems: mode === "detailed" ? 30 : 26,
        vocabSoftCap: 4,
        vocabHardCap: 6
      });
      shownAt = Date.now();
      sessionStartedAt = Date.now();
      transition = null;
      lastLogStatus = "waiting";
      render();
      syncTrajectory();
    }

    // ─── Logging pipeline (unchanged — see DEPLOYMENT_GUIDE.md §6) ──────
    function logCompletedSession() {
      if (!engine || !engine.state.result) return;
      const sid = engine.settings.seed;
      if (loggedSessionIds.has(sid)) return;
      loggedSessionIds.add(sid);
      const payload = {
        session_id: sid,
        log_build: LOG_BUILD,
        started_at: new Date(sessionStartedAt || Date.now()).toISOString(),
        ended_at: new Date().toISOString(),
        duration_ms: Date.now() - (sessionStartedAt || Date.now()),
        user_agent: navigator.userAgent,
        device: {
          screen_w: screen.width,
          screen_h: screen.height,
          dpr: window.devicePixelRatio || 1,
          lang: navigator.language,
          platform: navigator.platform || "",
          timezone: (Intl.DateTimeFormat().resolvedOptions().timeZone) || "",
          referrer: document.referrer || ""
        },
        mode: engine.settings.mode,
        result: engine.state.result,
        items_asked: engine.state.items_asked,
        confidence_at_end: engine.state.confidence,
        trajectory: engine.state.response_log
      };
      const body = JSON.stringify(payload);

      console.log("[log " + LOG_BUILD + "] firing for", sid, "size:", body.length);
      const showStatus = (m) => { try { setLogStatus(m); } catch {} };
      setTimeout(() => showStatus("sending…"), 100);

      let settled = false;
      const finish = (msg) => { if (!settled) { settled = true; showStatus(msg); } };

      // (1) Tiny GET — meta only, ~300-char URL, survives mobile carrier filters
      const meta = {
        session_id: sid,
        log_build: LOG_BUILD,
        started_at: payload.started_at,
        ended_at: payload.ended_at,
        duration_ms: payload.duration_ms,
        mode: payload.mode,
        items_asked: payload.items_asked,
        confidence_at_end: payload.confidence_at_end,
        result: payload.result,
        user_agent: (navigator.userAgent || "").slice(0, 300),
        device: payload.device,
        partial: true
      };
      const tinyBody = JSON.stringify(meta);
      const tinyUrl = LOG_ENDPOINT + "?d=" + encodeURIComponent(tinyBody);
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 8000);
        fetch(tinyUrl, { method: "GET", signal: ctrl.signal })
          .then((r) => { clearTimeout(t); if (r.ok) finish("✓ sent via tiny-GET (" + tinyBody.length + "B)"); else if (!settled) finish("tiny-GET error " + r.status); })
          .catch((e) => { clearTimeout(t); if (!settled) finish("tiny-GET failed: " + String(e?.message || e).slice(0, 40)); });
      } catch (e) { console.warn("[log] tiny-GET setup threw:", e); }

      // (2) sendBeacon — fire-and-forget, survives page unload
      try {
        if (navigator.sendBeacon) {
          const blob = new Blob([body], { type: "application/json" });
          navigator.sendBeacon(LOG_ENDPOINT, blob);
        }
      } catch (e) { console.warn("[log] sendBeacon threw:", e); }

      // (3) POST in parallel — replaces meta with full record if it lands
      try {
        const postCtrl = new AbortController();
        const postT = setTimeout(() => postCtrl.abort(), 6000);
        fetch(LOG_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body, keepalive: true, signal: postCtrl.signal
        }).then((r) => { clearTimeout(postT); if (r.ok && !settled) finish("✓ sent via POST (" + body.length + "B)"); })
          .catch(() => {});
      } catch (e) { console.warn("[log] POST setup threw:", e); }

      // (4) Trajectory chunks — 2 turns per GET, sequential
      const traj = payload.trajectory || [];
      const allItems = ((content && content.items) || []).concat((contentV2 && contentV2.items) || []);
      const itemById = new Map(allItems.map((it) => [it.id, it]));
      const enrichTurn = (e) => {
        const it = itemById.get(e.item_id);
        let promptText = "", selectedText = "";
        if (it) {
          promptText = (it.prompt || "")
            .replace(/<\s*strong\s*>/gi, "**")
            .replace(/<\s*\/\s*strong\s*>/gi, "**")
            .replace(/<[^>]*>/g, "")
            .replace(/\s+/g, " ").trim().slice(0, 200);
          const opt = (it.options || []).find((o) => o.id === e.selected_option_id);
          if (opt) selectedText = (opt.text || "").slice(0, 60);
        }
        return {
          t: e.turn,
          item_id: e.item_id,
          boundary: e.boundary,
          type: e.type,
          focus: e.focus || [],
          prompt: promptText,
          selected_option_id: e.selected_option_id,
          selected_text: selectedText,
          selected_role: e.selected_role,
          correct: e.correct,
          response_ms: e.response_ms,
          engine_action: e.engine_action,
          movement_reason: (e.movement_reason || "").slice(0, 100),
          state_after_boundary: e.state_after?.current_boundary,
          state_after_confidence: e.state_after?.confidence
        };
      };

      const CHUNK_SIZE = 2;
      const chunkTotal = Math.ceil(traj.length / CHUNK_SIZE);
      let chunkSuccess = 0;
      (async () => {
        for (let i = 0; i < traj.length; i += CHUNK_SIZE) {
          const idx = Math.floor(i / CHUNK_SIZE);
          const chunkBody = {
            session_id: sid,
            chunk_index: idx,
            chunk_total: chunkTotal,
            log_build: LOG_BUILD,
            turns: traj.slice(i, i + CHUNK_SIZE).map(enrichTurn)
          };
          const cUrl = LOG_ENDPOINT + "?d=" + encodeURIComponent(JSON.stringify(chunkBody));
          try {
            const r = await fetch(cUrl, { method: "GET" });
            if (r.ok) { chunkSuccess++; showStatus("✓ meta + " + chunkSuccess + "/" + chunkTotal + " chunks"); }
          } catch {}
          await new Promise((r) => setTimeout(r, 150));
        }
        if (chunkSuccess < chunkTotal) {
          showStatus("✓ meta + " + chunkSuccess + "/" + chunkTotal + " chunks (partial)");
        }
      })();
    }

    function setLogStatus(msg) {
      lastLogStatus = msg;
      const el = document.getElementById("log-status");
      if (el) el.textContent = `build: ${LOG_BUILD} · log: ${msg}`;
    }

    // ─── Answer flow (unchanged) ────────────────────────────────────────
    function answer(optionId) {
      if (!engine || !engine.currentItem || engine.state.result || transition) return;
      clearPromptTyping();
      // Soft-fade the picked choice so the user gets feedback before transition
      const btn = stageBody.querySelector(`[data-answer="${cssEsc(optionId)}"]`);
      if (btn) btn.classList.add("selected");
      const step = engine.answer(optionId, Date.now() - shownAt);
      const done = Boolean(engine.state.result);
      transition = {
        text: done ? "Sonucunu hazırlıyorum." : pickCopy(step),
        done
      };
      syncTrajectory();
      // small delay before swap so the highlight is perceptible
      setTimeout(() => {
        softSwap(() => {
          render();
          if (done) logCompletedSession();
        });
      }, 220);
      transitionTimer = window.setTimeout(() => {
        transition = null;
        shownAt = Date.now();
        softSwap(render);
      }, done ? 1020 : 880);
    }

    function softSwap(fn) {
      stage.classList.add("exiting");
      setTimeout(() => {
        fn();
        stage.classList.remove("exiting");
      }, 200);
    }

    // ─── Renderer ───────────────────────────────────────────────────────
    function render() {
      const isWelcome = !transition && !engine;
      document.body.classList.toggle("solid-bg", !isWelcome);
      if (transition) { stageBody.innerHTML = htmlTransition(); return; }
      if (!engine)    { stageBody.innerHTML = htmlWelcome();    wireWelcome(); return; }
      if (engine.state.result) { stageBody.innerHTML = htmlResult(engine.state.result); return; }
      stageBody.innerHTML = htmlQuestion();
      startPromptTypewriter(engine.currentItem.prompt);
    }

    // ─── Welcome screen ─────────────────────────────────────────────────
    const INFO_ITEMS = [
      {
        short: "Sorular cevaplarına göre seçilir",
        full:  "Sorular cevaplarına göre seçilir; bazen kolaylaşır, bazen daha ayırt edici olur.",
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="18" height="18" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="12" r="2.2"/><path d="M8 6c4 0 6 2 8 6"/><path d="M8 18c4 0 6-2 8-6"/></svg>'
      },
      {
        short: "Emin değilsen Bilmiyorum diyebilirsin",
        full:  "Emin değilsen Bilmiyorum diyebilirsin. Bu da testin sana uyum sağlamasına yardım eder.",
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="18" height="18" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.2a3 3 0 0 1 5.7 1c0 1.8-2.5 2.4-2.5 4"/><circle cx="12" cy="17" r="0.7" fill="currentColor" stroke="none"/></svg>'
      },
      {
        short: "Bazı soruların doğru cevaplarıyla birlikte yanlış cevapları da duruma göre değerlendirir",
        full:  "Bazı soruların doğru cevaplarıyla birlikte yanlış cevapları da duruma göre değerlendirir. Soruların seçenekleri sizin vereceğiniz tepkilere göre şekillenir.",
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="18" height="18" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M8 21h8"/><path d="M4 6c2.5 0 5-1 8-2 3 1 5.5 2 8 2"/><path d="M2 14c0-3 2-6 2-6s2 3 2 6c0 1.2-1 2-2 2s-2-.8-2-2z"/><path d="M16 14c0-3 2-6 2-6s2 3 2 6c0 1.2-1 2-2 2s-2-.8-2-2z"/></svg>'
      }
    ];

    function htmlWelcome() {
      const titleWords = ["Adaptif", "Seviye", "Testi"];
      const titleHtml = titleWords.map((w, i) => `
        <span class="hero-word ${i === 1 ? "accent" : ""}" style="animation-delay:${180 + i * 90}ms;">
          ${w}
          ${i === 1 ? `
            <svg class="hero-brush" viewBox="0 0 220 18" preserveAspectRatio="none" aria-hidden="true">
              <defs><filter id="brush-a"><feTurbulence baseFrequency="0.13" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter></defs>
              <path d="M4,10 Q 30 3, 60 9 T 120 9 T 180 7 T 216 11" stroke="#b84408" stroke-width="8" fill="none" opacity="0.32" stroke-linecap="round" filter="url(#brush-a)"/>
            </svg>
          ` : ""}
        </span>
      `).join("");
      const dropdowns = INFO_ITEMS.map((item, i) => `
        <div class="info-drop ${openInfo === i ? "open" : ""}" data-info-idx="${i}">
          <button class="info-toggle" type="button">
            <span class="info-icon">${item.icon}</span>
            <span class="info-label">${esc(item.short)}</span>
            <span class="info-chev">
              <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 5 6 8 9 5"/></svg>
            </span>
          </button>
          ${openInfo === i ? `<div class="info-body">${esc(item.full)}</div>` : ""}
        </div>
      `).join("");

      return `
        <div class="welcome">
          <div class="eyebrow">Kişiye özel seviye tespiti</div>
          <h1 class="hero-title">${titleHtml}</h1>
          <div class="tagline">
            <span id="tagline-live" class="typing-live"></span>
          </div>
          <div class="info-stack">${dropdowns}</div>
          <button class="primary" data-action="start" type="button">Başla</button>
        </div>
      `;
    }

    function wireWelcome() {
      // Info dropdown click → expand/collapse — toggle in place without full re-render
      stageBody.querySelectorAll("[data-info-idx]").forEach((el) => {
        el.querySelector(".info-toggle").addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const idx = parseInt(el.dataset.infoIdx, 10);
          const wasOpen = openInfo === idx;
          // Close any currently open dropdown
          stageBody.querySelectorAll(".info-drop.open").forEach((d) => {
            d.classList.remove("open");
            const body = d.querySelector(".info-body");
            if (body) body.remove();
          });
          if (wasOpen) {
            openInfo = -1;
          } else {
            openInfo = idx;
            el.classList.add("open");
            // Insert the expanded body
            const bodyDiv = document.createElement("div");
            bodyDiv.className = "info-body";
            bodyDiv.textContent = INFO_ITEMS[idx].full;
            el.appendChild(bodyDiv);
          }
        });
      });
      startTaglineTypewriter();
    }

    function startTaglineTypewriter() {
      const live = document.getElementById("tagline-live");
      if (!live) return;
      const text = "Sadece birkaç dakika sürer. Sorular cevaplarına göre değişir, seviyenden emin olduğu anda biter.";
      const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduced) { live.textContent = text; return; }
      if (taglineTypingTimer) clearTimeout(taglineTypingTimer);
      live.textContent = "";
      live.classList.add("typing");
      let i = 0;
      const step = () => {
        i = Math.min(text.length, i + 2);
        live.textContent = text.slice(0, i);
        if (i >= text.length) {
          live.classList.remove("typing");
          // Append blinking cursor
          const cur = document.createElement("span");
          cur.className = "typing-cursor";
          live.appendChild(cur);
          // remove cursor after a beat so it doesn't pulse forever during reading
          setTimeout(() => cur.remove(), 2400);
          return;
        }
        taglineTypingTimer = setTimeout(step, 22);
      };
      taglineTypingTimer = setTimeout(step, 800);
    }

    // ─── Question screen ────────────────────────────────────────────────
    function htmlQuestion() {
      const item = engine.currentItem;
      const opts = orderedOptions(item);
      const pct  = Math.min(95, calcProgress());
      const boundary = engine.state.current_boundary || "";
      const choicesHtml = opts.map((o, i) => `
        <button class="choice" style="animation-delay:${i * 60 + 420}ms;" data-answer="${esc(o.id)}" type="button"
          aria-label="${String.fromCharCode(65 + i)}. ${esc(o.text)}">
          <span class="letter">${String.fromCharCode(65 + i)}</span>
          <span class="choice-text">${esc(o.text)}</span>
        </button>
      `).join("");
      return `
        <div class="question-screen">
          <div class="q-topline">
            <div class="confidence-pill">
              <span class="label"><span class="dot"></span>EMİN OLMA YÜZDESİ</span>
              <span class="value">%${pct}</span>
            </div>
          </div>
          <div class="progress-rail" aria-hidden="true">
            <div class="progress-fill" style="width:${pct}%;"></div>
          </div>
          <div class="instruction">${esc(instrFor(item))}</div>
          <div class="prompt-card">
            <span class="prompt-ghost">${promptHtml(item.prompt)}</span>
            <span class="typing-live typing" data-typewriter-prompt>${promptHtml(item.prompt)}</span>
          </div>
          <div class="choices">${choicesHtml}</div>
          <button class="unknown-btn" data-answer="unknown" type="button">Bilmiyorum</button>
          <div class="cancel-row">
            <button class="cancel-btn" data-action="reset" type="button">vazgeç</button>
          </div>
        </div>
      `;
    }

    // ─── Transition ─────────────────────────────────────────────────────
    function htmlTransition() {
      const txt = transition?.text || "";
      return `
        <div class="transition-screen">
          <div class="transition-pen" aria-hidden="true">
            <svg width="78" height="42" viewBox="0 0 120 60" fill="none">
              <path d="M5 35 Q 25 8, 60 30 T 115 25" stroke="${"#b84408"}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="transition-text">${esc(txt)}</div>
          <div class="transition-sub">Kısa test akışı devam ediyor.</div>
        </div>
      `;
    }

    // ─── Result ─────────────────────────────────────────────────────────
    function htmlResult(result) {
      const conf = (result.confidence || "low").toLowerCase();
      const caveat = (conf === "medium")
        ? `<div class="result-caveat">Sonuç orta güvenle belirlendi.</div>`
        : "";
      return `
        <div class="result-screen">
          <div class="result-eyebrow">ÖNERİLEN BAŞLANGIÇ SEVİYEN</div>
          <div class="level-glyph">${esc(result.estimated_level)}</div>
          <div class="level-rule"></div>
          <p>Bu test daha çok tanıma becerini ölçer. Konuşma ve yazma ilk günlerde biraz daha düşük hissedebilir.</p>
          ${caveat}
          <div class="feedback-card">
            <div class="feedback-q">Sizce test ne kadar isabetli tahmin yaptı?</div>
            <div class="feedback-opts">
              <button class="feedback-opt" data-feedback="accurate"  type="button">Yeterince isabetliydi</button>
              <button class="feedback-opt" data-feedback="needs_work" type="button">Pek isabetli değildi, geliştirilmeli</button>
              <button class="feedback-opt" data-feedback="wrong"     type="button">Tamamen yanlış bildi</button>
            </div>
            <label class="feedback-label" for="feedback-comment">İletmek istediğiniz görüşünüz varsa bize yazın:</label>
            <textarea id="feedback-comment" class="feedback-input" rows="3" maxlength="800" placeholder="(isteğe bağlı)"></textarea>
            <button class="feedback-submit" id="feedback-submit" type="button">Gönder</button>
            <div class="feedback-status" id="feedback-status"></div>
          </div>
          <div id="log-status" class="log-status-line">build: ${LOG_BUILD} · log: ${lastLogStatus}</div>
          <button class="restart-btn" data-action="reset" type="button">Tekrar test et</button>
        </div>
      `;
    }

    // ─── Trajectory sync (writes into slide-up overlay) ─────────────────
    function syncTrajectory() {
      const log = engine?.state?.response_log || [];
      trajTurns.textContent = `${log.length} turns`;
      if (log.length) {
        trajCount.textContent = String(log.length);
        trajCount.style.display = "inline-block";
      } else {
        trajCount.style.display = "none";
      }
      if (!log.length) {
        trajList.innerHTML = `<div class="traj-empty">Henüz veri yok.</div>`;
        return;
      }
      trajList.innerHTML = log.map((e) => {
        const action = e.movement_reason ? esc(e.movement_reason) : esc(e.engine_action || "");
        const before = e.state_before?.current_boundary || "";
        const after  = e.state_after?.current_boundary  || "";
        return `
          <div class="traj-row">
            <div class="traj-r1">
              <div class="traj-turn-bubble">${e.turn}</div>
              <code class="traj-action-code">${esc(e.engine_action || "step")}</code>
              <span class="traj-tag">${esc(e.type || "")}</span>
              <span class="traj-ms">${e.response_ms ?? "—"}ms</span>
            </div>
            <div class="traj-r2">
              <span class="traj-boundary">${esc(before)}${after && after !== before ? " → " + esc(after) : ""}</span>
              <span class="traj-role">${esc(e.selected_role || "")}</span>
              <span class="traj-selected">${e.correct ? "✓" : "✗"} <em>${esc(e.selected_option_id || "")}</em></span>
            </div>
            <div class="traj-r3">${action}</div>
          </div>
        `;
      }).join("");
    }

    // ─── Helpers ────────────────────────────────────────────────────────
    function mergedItems() {
      const legacy = content.items || [];
      const diagnostic = (contentV2?.items || []).map((item) => ({
        ...item,
        source_collection: item.source_collection || "diagnostic_v2"
      }));
      return legacy.concat(diagnostic);
    }
    function coreItems() {
      const retired = new Set((window.NEKTAR_LEGACY_RETIRED_IDS || []));
      const items = mergedItems().filter((i) => {
        if (i.source_collection === "diagnostic_v2") return true;
        if (LEGACY_CORE_EXCLUDED.has(i.type)) return false;
        if (retired.has(i.id)) return false;
        return true;
      });
      return items.length ? items : mergedItems();
    }
    function pickCopy(step) {
      const turn = engine?.state?.items_asked || 0;
      const sv   = engine?.settings?.seed || "anka";
      const u    = Engine.hashToUnit(`${sv}|transition|${turn}|${step?.logEntry?.item_id || ""}`);
      return TRANSITION_COPY[Math.floor(u * TRANSITION_COPY.length) % TRANSITION_COPY.length];
    }
    function clearTimer() {
      if (transitionTimer) window.clearTimeout(transitionTimer);
      transitionTimer = null;
      clearPromptTyping();
    }
    function clearPromptTyping() {
      if (promptTypingTimer) window.clearTimeout(promptTypingTimer);
      promptTypingTimer = null;
    }
    function startPromptTypewriter(promptText) {
      clearPromptTyping();
      const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const live = stageBody.querySelector("[data-typewriter-prompt]");
      if (!live) return;
      const full = promptPlainText(promptText);
      if (reduced || full.length < 2) {
        live.innerHTML = promptHtml(promptText);
        live.classList.remove("typing");
        return;
      }
      live.textContent = "";
      live.classList.add("typing");
      let i = 0;
      const stepSize = full.length > 150 ? 5 : full.length > 90 ? 4 : 3;
      const step = () => {
        i = Math.min(full.length, i + stepSize);
        live.textContent = full.slice(0, i);
        if (i >= full.length) {
          live.innerHTML = promptHtml(promptText);
          live.classList.remove("typing");
          return;
        }
        promptTypingTimer = setTimeout(step, 18);
      };
      promptTypingTimer = setTimeout(step, 80);
    }
    function calcProgress() {
      const asked = engine?.state?.items_asked || 0;
      const min   = engine?.settings?.mode === "detailed"
        ? engine.settings.detailedMinItems
        : engine.settings.standardMinItems;
      const conf  = engine?.state?.confidence || "low";
      const boost = conf === "high" ? 18 : conf === "medium" ? 8 : 0;
      return Math.round(Math.min(95, ((asked / Math.max(1, min)) * 72) + boost));
    }
    function orderedOptions(item) {
      return item.options
        .map((o, idx) => ({
          o,
          sort: Engine.hashToUnit(`${engine.settings.seed}|${item.id}|${o.id}|${idx}`)
        }))
        .sort((a, b) => a.sort - b.sort)
        .map((x) => x.o);
    }
    function instrFor(item) {
      if (["pragmatic_choice","naturalness_judgment","function","natural_speech","spoken_chunk"].includes(item.type))
        return "En doğal cevabı seç.";
      if (item.type === "discourse_marker") return "Cümledeki ilişkiye uygun bağlacı seç.";
      if (item.type === "vocab" || item.format === "meaning_tr_en") return "Anlamı seç.";
      if (["idiom","collocation","phrasal_verb"].includes(item.type))
        return "Cümleyi doğal tamamlayan ifadeyi seç.";
      return "Boşluğu tamamla.";
    }
    function esc(v) {
      return String(v ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[c]));
    }
    function cssEsc(v) {
      // For attribute selectors — same as esc but no entity encoding needed
      return String(v ?? "").replace(/["\\]/g, "\\$&");
    }
    function promptPlainText(v) {
      return String(v ?? "").replace(/<\/?strong>/gi, "");
    }
    function promptHtml(v) {
      return esc(v)
        .replace(/&lt;strong&gt;/gi, "<strong>")
        .replace(/&lt;\/strong&gt;/gi, "</strong>");
    }

    // ─── Feedback widget ────────────────────────────────────────────────
    let selectedFeedback = null;
    function sendFeedback(sid) {
      const commentEl = document.getElementById("feedback-comment");
      const statusEl  = document.getElementById("feedback-status");
      const cardEl    = document.querySelector(".feedback-card");
      const submitBtn = document.getElementById("feedback-submit");
      const comment = ((commentEl && commentEl.value) || "").slice(0, 800);
      if (!selectedFeedback && !comment) {
        if (statusEl) { statusEl.textContent = "Lütfen bir seçenek seç veya yorum yaz."; statusEl.className = "feedback-status err"; }
        return;
      }
      if (statusEl) { statusEl.textContent = "Gönderiliyor…"; statusEl.className = "feedback-status"; }
      if (submitBtn) submitBtn.disabled = true;
      const payload = {
        session_id: sid,
        log_build: LOG_BUILD,
        feedback: {
          accuracy_rating: selectedFeedback,
          comment,
          submitted_at: new Date().toISOString()
        }
      };
      const url = LOG_ENDPOINT + "?d=" + encodeURIComponent(JSON.stringify(payload));
      fetch(url, { method: "GET" })
        .then((r) => {
          if (r.ok) {
            if (statusEl) { statusEl.textContent = "✓ Teşekkürler!"; statusEl.className = "feedback-status ok"; }
            if (cardEl) cardEl.classList.add("submitted");
          } else {
            if (statusEl) { statusEl.textContent = "Gönderilemedi (" + r.status + ")"; statusEl.className = "feedback-status err"; }
            if (submitBtn) submitBtn.disabled = false;
          }
        })
        .catch((e) => {
          if (statusEl) { statusEl.textContent = "Ağ hatası: " + String(e?.message || e).slice(0, 40); statusEl.className = "feedback-status err"; }
          if (submitBtn) submitBtn.disabled = false;
        });
    }

    // ─── Event delegation ───────────────────────────────────────────────
    stageBody.addEventListener("click", (e) => {
      if (transition) return;
      const fbBtn = e.target.closest("[data-feedback]");
      if (fbBtn) {
        selectedFeedback = fbBtn.dataset.feedback;
        stageBody.querySelectorAll(".feedback-opt").forEach((b) => b.classList.toggle("selected", b === fbBtn));
        return;
      }
      if (e.target.closest("#feedback-submit")) {
        const sid = engine?.settings?.seed || "no-session";
        sendFeedback(sid);
        return;
      }
      const ab = e.target.closest("[data-answer]");
      if (ab) { answer(ab.dataset.answer); return; }
      const ab2 = e.target.closest("[data-action]");
      if (!ab2) return;
      if (ab2.dataset.action === "start")    start("standard");
      if (ab2.dataset.action === "detailed") start("detailed");
      if (ab2.dataset.action === "reset") {
        clearTimer();
        engine = null;
        transition = null;
        selectedFeedback = null;
        openInfo = -1;
        render();
        syncTrajectory();
      }
    });

    // ─── Boot ───────────────────────────────────────────────────────────
    render();
    syncTrajectory();
  </script>
</body>
</html>
