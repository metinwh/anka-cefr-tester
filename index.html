<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ANKA CEFR Tester — Nektar</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #111827;
      --panel-soft: #1a2535;
      --text: #f4f0eb;
      --muted: #7e8ea2;
      --accent: #ff7a1a;
      --accent-soft: #ffb36f;
      --border: rgba(255, 255, 255, 0.07);
      --radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      min-height: 100%;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Background orbs ─────────────────────────────────── */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      will-change: transform;
    }

    .bg-orb:nth-child(1) {
      width: 560px; height: 560px;
      background: radial-gradient(circle, rgba(255,122,26,0.22), transparent 70%);
      top: -180px; left: -120px;
      animation: orb1 20s ease-in-out infinite;
    }
    .bg-orb:nth-child(2) {
      width: 440px; height: 440px;
      background: radial-gradient(circle, rgba(255,68,0,0.15), transparent 70%);
      bottom: 10%; right: -100px;
      animation: orb2 26s ease-in-out infinite;
    }
    .bg-orb:nth-child(3) {
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(255,160,60,0.1), transparent 70%);
      top: 45%; left: 35%;
      animation: orb3 32s ease-in-out infinite;
    }

    @keyframes orb1 {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(40px,50px) scale(1.1); }
      66% { transform: translate(-25px,25px) scale(0.93); }
    }
    @keyframes orb2 {
      0%,100% { transform: translate(0,0) scale(1); }
      40% { transform: translate(-50px,-35px) scale(1.12); }
      70% { transform: translate(25px,-55px) scale(0.9); }
    }
    @keyframes orb3 {
      0%,100% { transform: translate(-50%,-50%) scale(1); }
      50% { transform: translate(-50%,calc(-50% - 35px)) scale(1.18); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-orb { animation: none; }
    }

    /* ── Layout ──────────────────────────────────────────── */
    .layout {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
    }

    .app-area {
      flex: 1;
      width: 100%;
      max-width: 480px;
      padding: calc(20px + var(--safe-top)) 16px calc(20px + var(--safe-bottom));
      display: grid;
      align-content: center;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* ── Screen card ─────────────────────────────────────── */
    .screen {
      position: relative;
      min-height: 640px;
      display: grid;
      align-content: center;
      gap: 18px;
      padding: 28px 22px;
      border-radius: 26px;
      background:
        linear-gradient(160deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.008) 100%),
        var(--panel);
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow:
        0 40px 120px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,122,26,0.04),
        inset 0 1px 0 rgba(255,255,255,0.06);
      overflow: hidden;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(ellipse at 15% -5%, rgba(255,122,26,0.09), transparent 55%);
      pointer-events: none;
    }

    .screen.question { align-content: start; }

    .screen.fade { animation: fadeUp 320ms cubic-bezier(0.22,1,0.36,1) both; }

    /* ── Topline ─────────────────────────────────────────── */
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 26px;
      padding: 0 11px;
      border-radius: 999px;
      background: rgba(255,122,26,0.1);
      border: 1px solid rgba(255,122,26,0.22);
      color: var(--accent-soft);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: none;
    }

    .chip::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: dotPulse 2.2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes dotPulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.65); }
    }

    /* ── Progress ────────────────────────────────────────── */
    .progress {
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft), var(--accent));
      background-size: 200% 100%;
      transition: width 420ms cubic-bezier(0.22,1,0.36,1);
      animation: barShimmer 2.2s linear infinite;
    }

    @keyframes barShimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    /* ── Typography ──────────────────────────────────────── */
    h1 {
      font-size: 36px;
      line-height: 1.04;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    .shimmer-text {
      background: linear-gradient(
        90deg,
        var(--text) 0%,
        var(--text) 35%,
        var(--accent-soft) 50%,
        var(--text) 65%,
        var(--text) 100%
      );
      background-size: 300% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: textShimmer 5s linear infinite;
    }

    @keyframes textShimmer {
      0% { background-position: 100% center; }
      100% { background-position: -100% center; }
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    /* ── Welcome ─────────────────────────────────────────── */
    .welcome { display: grid; gap: 20px; }
    .welcome-head { display: grid; gap: 10px; }

    .info-list { display: grid; gap: 9px; }

    .info-item {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 11px;
      align-items: start;
      padding: 13px;
      border-radius: var(--radius);
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      transition: border-color 200ms ease, background 200ms ease;
      animation: fadeUp 400ms cubic-bezier(0.22,1,0.36,1) both;
      animation-delay: calc(var(--i,0) * 80ms + 80ms);
    }

    /* (hover removed — mobile-first tap UI) */

    .info-dot {
      width: 28px; height: 28px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255,122,26,0.14);
      color: var(--accent-soft);
      font-weight: 900;
      font-size: 12px;
      flex-shrink: 0;
    }

    /* ── Instruction ─────────────────────────────────────── */
    .instruction {
      color: var(--muted);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: none;
    }

    /* ── Prompt ──────────────────────────────────────────── */
    .prompt {
      position: relative;
      min-height: 76px;
      display: grid;
      align-items: center;
      padding: 18px;
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 20px;
      line-height: 1.4;
      font-weight: 700;
      animation: fadeUp 320ms cubic-bezier(0.22,1,0.36,1) both;
    }

    .prompt::before {
      content: "";
      position: absolute;
      top: -1px; left: 20px; right: 20px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,122,26,0.35), transparent);
    }

    /* ── Choices ─────────────────────────────────────────── */
    .choices { display: grid; gap: 9px; }

    .choice {
      position: relative;
      min-height: 56px;
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 10px;
      align-items: center;
      text-align: left;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.022);
      color: var(--text);
      transition:
        border-color 180ms ease,
        background 180ms ease,
        transform 180ms cubic-bezier(0.22,1,0.36,1),
        box-shadow 180ms ease;
      animation: choiceIn 320ms cubic-bezier(0.22,1,0.36,1) both;
      animation-delay: calc(var(--i) * 55ms);
      overflow: hidden;
    }

    .choice::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(255,122,26,0.06), transparent 60%);
      opacity: 0;
      transition: opacity 180ms ease;
    }

    /* Tap-only feedback. No hover state on any device. */
    .choice:active {
      transform: scale(0.985);
      border-color: rgba(255,122,26,0.42);
      background: rgba(255,122,26,0.06);
    }
    .choice:active::after { opacity: 1; }

    .letter {
      width: 28px; height: 28px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .choice-text {
      font-size: 16px;
      line-height: 1.4;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }

    /* ── Buttons ─────────────────────────────────────────── */
    .primary {
      min-height: 52px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 15px;
      background: linear-gradient(135deg, #ff8c2a, var(--accent));
      color: #1a0800;
      letter-spacing: 0.01em;
      transition:
        transform 180ms cubic-bezier(0.22,1,0.36,1),
        box-shadow 180ms ease,
        filter 180ms ease;
      box-shadow: 0 4px 22px rgba(255,122,26,0.38);
      position: relative;
      overflow: hidden;
    }

    .primary::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, rgba(255,255,255,0.18), transparent 55%);
      pointer-events: none;
    }

    /* Tap-only feedback. */
    .primary:active {
      transform: scale(0.98);
      filter: brightness(1.04);
    }

    .primary.pulse {
      animation: btnPulse 2.8s ease-in-out infinite;
    }

    @keyframes btnPulse {
      0%,100% { box-shadow: 0 4px 22px rgba(255,122,26,0.38); }
      50% { box-shadow: 0 4px 35px rgba(255,122,26,0.65), 0 0 0 6px rgba(255,122,26,0.1); }
    }

    .unknown {
      min-height: 44px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      transition: border-color 180ms ease, color 180ms ease, background 180ms ease;
    }
    /* Tap-only feedback. */
    .unknown:active {
      background: rgba(255,255,255,0.05);
      color: var(--text);
    }

    /* ── Transition screen ───────────────────────────────── */
    .transition-screen {
      min-height: 520px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .thinking-card {
      display: grid;
      gap: 22px;
      justify-items: center;
      padding: 36px 24px;
    }

    .thinking-bars {
      display: flex;
      align-items: end;
      gap: 7px;
      height: 52px;
    }

    .thinking-bars span {
      width: 7px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--accent-soft), var(--accent));
      animation: barPulse 920ms cubic-bezier(0.45,0.05,0.55,0.95) infinite;
      animation-delay: calc(var(--i) * 115ms);
      box-shadow: 0 0 14px rgba(255,122,26,0.45);
    }

    .thinking-bars span:nth-child(1) { height: 18px; }
    .thinking-bars span:nth-child(2) { height: 34px; }
    .thinking-bars span:nth-child(3) { height: 26px; }
    .thinking-bars span:nth-child(4) { height: 44px; }
    .thinking-bars span:nth-child(5) { height: 16px; }

    .transition-text {
      max-width: 22ch;
      color: var(--text);
      font-size: 23px;
      line-height: 1.22;
      font-weight: 800;
    }

    .transition-sub {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    /* ── Result screen ───────────────────────────────────── */
    .result-screen { display: grid; gap: 14px; }

    .result-eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: none;
    }

    .level {
      font-size: 92px;
      line-height: 0.88;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--accent-soft) 20%, var(--accent) 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: levelReveal 500ms cubic-bezier(0.22,1,0.36,1) both;
      filter: drop-shadow(0 0 28px rgba(255,122,26,0.45));
    }

    @keyframes levelReveal {
      from {
        opacity: 0;
        transform: scale(0.68) translateY(12px);
        filter: drop-shadow(0 0 0 rgba(255,122,26,0));
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: drop-shadow(0 0 28px rgba(255,122,26,0.45));
      }
    }

    /* ── Core keyframes ──────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes choiceIn {
      from { opacity: 0; transform: translateY(9px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes barPulse {
      0%,100% { transform: scaleY(0.5); opacity: 0.45; }
      50%     { transform: scaleY(1);   opacity: 1; }
    }

    /* ── Mobile ──────────────────────────────────────────── */
    @media (max-width: 500px) {
      .app-area {
        padding: var(--safe-top) 0 0;
        align-content: start;
      }
      .screen {
        min-height: 100dvh;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        padding: calc(24px + var(--safe-top)) 18px calc(24px + var(--safe-bottom));
      }
      .screen::before { display: none; }
      h1 { font-size: 30px; }
      .prompt { font-size: 18px; }
      .choice-text { font-size: 15px; }
      .level { font-size: 80px; }
    }

    /* ── Trajectory console ──────────────────────────────── */
    .console-wrapper {
      width: 100%;
      max-width: 1100px;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .console-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 1.5px solid rgba(255,122,26,0.6);
      border-radius: 12px;
      color: var(--accent-soft);
      font-size: 11px;
      font-weight: 800;
      padding: 12px 24px;
      letter-spacing: 0.08em;
      background: rgba(255,122,26,0.12);
      transition: all 180ms ease;
      box-shadow: 0 4px 12px rgba(255,122,26,0.1);
    }

    .console-toggle-btn:active {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent);
      transform: scale(0.98);
    }

    .console-toggle-btn svg {
      flex-shrink: 0;
      transition: transform 240ms cubic-bezier(0.22,1,0.36,1);
    }

    .console-toggle-btn.open svg { transform: rotate(180deg); }

    .console-panel {
      width: 100%;
      background: rgba(255,255,255,0.018);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: none;
    }

    .console-panel.visible {
      display: block;
      animation: fadeUp 240ms ease both;
    }

    .console-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
    }

    .console-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: 0.04em;
      text-transform: none;
    }

    .turn-pill {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255,122,26,0.1);
      border: 1px solid rgba(255,122,26,0.22);
      color: var(--accent-soft);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .console-table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
    }

    .console-table td {
      padding: 6px 8px;
      color: rgba(255,255,255,0.75);
      border-bottom: 1px solid rgba(255,255,255,0.028);
      font-size: 10px;
    }

    .console-table th {
      padding: 6px 8px;
      text-align: left;
      color: var(--muted);
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 0.05em;
      text-transform: none;
      border-bottom: 1px solid var(--border);
    }

    .console-table tr:last-child td { border-bottom: 0; }
    /* (row hover removed) */

    .console-table code {
      background: rgba(255,255,255,0.07);
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 10px;
    }

    .console-empty {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      font-family: inherit;
    }

    /* ── Footer ──────────────────────────────────────────── */
    .footer {
      padding: 14px 16px calc(14px + var(--safe-bottom));
      text-align: center;
      color: rgba(255,255,255,0.18);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: none;
    }
  </style>
</head>
<body>

  <div class="bg-orbs" aria-hidden="true">
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
  </div>

  <div class="layout">

    <div class="app-area">
      <section id="app" class="screen"></section>
    </div>

    <div class="console-wrapper">
      <button class="console-toggle-btn" id="console-toggle" type="button">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3 5 7 9 11 5"/>
        </svg>
        <span id="console-label">KAYIT DEFTERİNİ GÖSTER</span>
      </button>

      <div class="console-panel" id="console-panel">
        <div class="console-head">
          <span class="console-title">TRAJECTORY</span>
          <span class="turn-pill" id="turn-pill">0 turns</span>
        </div>
        <div class="table-scroll">
          <table class="console-table">
            <thead>
              <tr>
                <th>Turn</th>
                <th>Item</th>
                <th>Boundary</th>
                <th>Type</th>
                <th>Focus</th>
                <th>Selected</th>
                <th>Role</th>
                <th>Correct</th>
                <th>MS</th>
                <th>Action</th>
                <th>Before</th>
                <th>After</th>
                <th>Confidence</th>
              </tr>
            </thead>
            <tbody id="trajectory-body">
              <tr><td colspan="13" class="console-empty">Henüz veri yok.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <img src="./loading_dark.png" alt="Nektar Logo" style="height: 24px; opacity: 0.8; filter: grayscale(1) brightness(2); transition: all 0.3s ease;" onmouseover="this.style.opacity='1'; this.style.filter='none'" onmouseout="this.style.opacity='0.8'; this.style.filter='grayscale(1) brightness(2)'">
        <span>NEKTAR Lab: ANKA CEFR Tester Beta / 2026 all rights reserved</span>
      </div>
    </footer>

  </div>

  <script src="./placement-questions.js"></script>
  <script src="./placement-pool.generated.js"></script>
  <script src="./placement-questions-v2.js"></script>
  <script src="./ceiling-probe-engine.js"></script>
  <script>
    const Engine  = window.NektarCeilingProbeEngine;
    const content = window.NEKTAR_PLACEMENT_CONTENT;
    const contentV2 = window.NEKTAR_PLACEMENT_CONTENT_V2;
    const app     = document.getElementById("app");

    /* Console toggle */
    const consoleToggle = document.getElementById("console-toggle");
    const consolePanel  = document.getElementById("console-panel");
    const consoleLabel  = document.getElementById("console-label");
    const turnPill      = document.getElementById("turn-pill");
    const tBody         = document.getElementById("trajectory-body");
    let consoleOpen = true;

    // Initialize console state
    if (consoleOpen) {
      consolePanel.classList.add("visible");
      consoleToggle.classList.add("open");
      consoleLabel.textContent = "KAYIT DEFTERİNİ GİZLE";
    }

    consoleToggle.addEventListener("click", () => {
      consoleOpen = !consoleOpen;
      consolePanel.classList.toggle("visible", consoleOpen);
      consoleToggle.classList.toggle("open", consoleOpen);
      consoleLabel.textContent = consoleOpen ? "KAYIT DEFTERİNİ GİZLE" : "KAYIT DEFTERİNİ GÖSTER";
    });

    /* Engine state */
    // LEGACY_CORE_EXCLUDED only filters items WITHOUT source_collection === "diagnostic_v2".
    // Codex v2 items bypass this filter entirely.
    //
    // Audit (CODEX_BRIEF.md context):
    //  - naturalness_judgment: 7 legacy items, all clean → ENABLED
    //  - pragmatic_choice: 8 legacy items, all have "You are at..." scaffolding bug → kept off,
    //    Codex v2 will deliver 40 fresh pragmatic_choice items
    //  - function / natural_speech / spoken_chunk: design overlap or require audio → kept off
    const LEGACY_CORE_EXCLUDED = new Set([
      "function", "pragmatic_choice", "natural_speech", "spoken_chunk"
    ]);

    const TRANSITION_COPY = [
      "Cevabın kaydedildi.",
      "Bir sonraki soruyu seçiyorum.",
      "Bir sonraki sorunun zorluğunu ayarlıyorum.",
      "Hmm... sıradaki maddeyi hazırlıyorum.",
      "Tamam, şimdi sonraki soruya geçiyoruz.",
      "Kısa bir kontrol daha yapıyorum.",
      "Akışı cevabına göre güncelliyorum.",
      "Sıradaki soru hazırlanıyor.",
      "Bir sonraki maddeyi seçiyorum.",
      "Sonucunu netleştirmek için devam ediyoruz."
    ];

    let engine  = null;
    let shownAt = 0;
    let transition = null;
    let transitionTimer = null;

    function seed() {
      const s = new URLSearchParams(location.search).get("seed");
      return s || `anka-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    let sessionStartedAt = null;
    let loggedSessionIds = new Set();

    function start(mode = "standard") {
      clearTimer();
      engine = Engine.createEngine(coreItems(), {
        seed: seed(),
        mode,
        startBoundary: "A1/A2",
        standardMinItems: 8,
        detailedMinItems: 14,
        maxItems: mode === "detailed" ? 28 : 24
      });
      shownAt = Date.now();
      sessionStartedAt = Date.now();
      transition = null;
      lastLogStatus = "waiting";   // reset for the new session
      render();
      syncTrajectory();
    }

    // Logging build tag — bump this to force cache busting on the phone.
    const LOG_BUILD = "v12-2026-05-16-seqchunks-rich";
    // Endpoint URL — content blockers (1Blocker, AdGuard) often kill anything
    // matching "/log" patterns. Use a neutral name.
    const LOG_ENDPOINT = "/api/record";
    // Latest log status — stored so the indicator survives the render race
    // between transition→result screens.
    let lastLogStatus = "waiting";

    function logCompletedSession() {
      if (!engine || !engine.state.result) return;
      const sid = engine.settings.seed;
      if (loggedSessionIds.has(sid)) return;
      loggedSessionIds.add(sid);
      const payload = {
        session_id: sid,
        log_build: LOG_BUILD,
        started_at: new Date(sessionStartedAt || Date.now()).toISOString(),
        ended_at: new Date().toISOString(),
        duration_ms: Date.now() - (sessionStartedAt || Date.now()),
        user_agent: navigator.userAgent,
        device: {
          screen_w: screen.width,
          screen_h: screen.height,
          dpr: window.devicePixelRatio || 1,
          lang: navigator.language,
          platform: navigator.platform || "",
          timezone: (Intl.DateTimeFormat().resolvedOptions().timeZone) || "",
          referrer: document.referrer || ""
        },
        mode: engine.settings.mode,
        result: engine.state.result,
        items_asked: engine.state.items_asked,
        confidence_at_end: engine.state.confidence,
        trajectory: engine.state.response_log
      };
      const body = JSON.stringify(payload);

      console.log("[log " + LOG_BUILD + "] firing for", sid, "size:", body.length);
      const showStatus = (m) => { try { setLogStatus(m); } catch {} };
      setTimeout(() => showStatus("sending…"), 100);

      let settled = false;
      const finish = (msg) => { if (!settled) { settled = true; showStatus(msg); } };

      // --- MEDIUM-sized GET payload (everything except trajectory) ---
      // Uses real field names so the admin can render rows properly.
      // Trajectory is dropped here because it doesn't fit under most mobile
      // URL filters (~2-4KB). A separate POST attempt may still deliver it.
      const meta = {
        session_id: sid,
        log_build: LOG_BUILD,
        started_at: payload.started_at,
        ended_at: payload.ended_at,
        duration_ms: payload.duration_ms,
        mode: payload.mode,
        items_asked: payload.items_asked,
        confidence_at_end: payload.confidence_at_end,
        result: payload.result,                   // full result object
        user_agent: (navigator.userAgent || "").slice(0, 300),
        device: payload.device,                   // full device fingerprint
        partial: true                              // marker: trajectory missing
      };
      const tinyBody = JSON.stringify(meta);
      const tinyUrl = LOG_ENDPOINT + "?d=" + encodeURIComponent(tinyBody);
      console.log("[log] meta URL length:", tinyUrl.length);

      // --- (1) Tiny GET — should pass any URL-length filter ---
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 8000);
        fetch(tinyUrl, { method: "GET", signal: ctrl.signal })
          .then(async (r) => {
            clearTimeout(t);
            if (r.ok) finish("✓ sent via tiny-GET (" + tinyBody.length + "B)");
            else if (!settled) finish("tiny-GET error " + r.status);
          })
          .catch((e) => {
            clearTimeout(t);
            console.warn("[log] tiny-GET failed:", e);
            if (!settled) finish("tiny-GET failed: " + String(e?.message || e).slice(0, 40));
          });
      } catch (e) { console.warn("[log] tiny-GET setup threw:", e); }

      // --- (2) sendBeacon w/ full body (background, best-effort) ---
      try {
        if (navigator.sendBeacon) {
          const blob = new Blob([body], { type: "application/json" });
          navigator.sendBeacon(LOG_ENDPOINT, blob);
        }
      } catch (e) { console.warn("[log] sendBeacon threw:", e); }

      // --- (3) Full POST in parallel — if filter doesn't block it, full
      //         trajectory overwrites the tiny record (same session_id). ---
      try {
        const postCtrl = new AbortController();
        const postT = setTimeout(() => postCtrl.abort(), 6000);
        fetch(LOG_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body,
          keepalive: true,
          signal: postCtrl.signal
        }).then(async (r) => {
          clearTimeout(postT);
          if (r.ok && !settled) finish("✓ sent via POST (" + body.length + "B)");
        }).catch(() => { /* silent — tiny-GET path is the safety net */ });
      } catch (e) { console.warn("[log] POST setup threw:", e); }

      // --- (4) Trajectory chunks via sequential GETs ---
      // We fire chunks one-at-a-time with a small delay to dodge mobile
      // rate-limiting/connection-throttling. Each chunk lives in its own
      // blob path so they never race-overwrite each other.
      // Each turn carries prompt + selected text so the admin can show the
      // actual question content and the engine's action.
      const traj = payload.trajectory || [];
      const allItems = ((content && content.items) || []).concat((contentV2 && contentV2.items) || []);
      const itemById = new Map(allItems.map((it) => [it.id, it]));
      const enrichTurn = (e) => {
        const it = itemById.get(e.item_id);
        let promptText = "";
        let selectedText = "";
        if (it) {
          promptText = (it.prompt || "").slice(0, 90);
          const opt = (it.options || []).find((o) => o.id === e.selected_option_id);
          if (opt) selectedText = (opt.text || "").slice(0, 60);
        }
        return {
          t: e.turn,
          item_id: e.item_id,
          boundary: e.boundary,
          type: e.type,
          focus: e.focus || [],
          prompt: promptText,
          selected_option_id: e.selected_option_id,
          selected_text: selectedText,
          selected_role: e.selected_role,
          correct: e.correct,
          response_ms: e.response_ms,
          engine_action: e.engine_action,
          movement_reason: (e.movement_reason || "").slice(0, 100),
          state_after_boundary: e.state_after?.current_boundary,
          state_after_confidence: e.state_after?.confidence
        };
      };

      const CHUNK_SIZE = 2;
      const chunkTotal = Math.ceil(traj.length / CHUNK_SIZE);
      let chunkSuccess = 0;
      (async () => {
        for (let i = 0; i < traj.length; i += CHUNK_SIZE) {
          const idx = Math.floor(i / CHUNK_SIZE);
          const chunkBody = {
            session_id: sid,
            chunk_index: idx,
            chunk_total: chunkTotal,
            log_build: LOG_BUILD,
            turns: traj.slice(i, i + CHUNK_SIZE).map(enrichTurn)
          };
          const cBody = JSON.stringify(chunkBody);
          const cUrl = LOG_ENDPOINT + "?d=" + encodeURIComponent(cBody);
          try {
            const r = await fetch(cUrl, { method: "GET" });
            if (r.ok) {
              chunkSuccess++;
              console.log("[log] chunk", idx, "/", chunkTotal, "ok (url", cUrl.length, ")");
              showStatus("✓ meta + " + chunkSuccess + "/" + chunkTotal + " chunks");
            } else {
              console.warn("[log] chunk", idx, "error", r.status);
            }
          } catch (e) {
            console.warn("[log] chunk", idx, "failed:", e);
          }
          // Tiny delay so we don't trigger carrier-side rate limits.
          await new Promise((r) => setTimeout(r, 150));
        }
        if (chunkSuccess < chunkTotal) {
          showStatus("✓ meta + " + chunkSuccess + "/" + chunkTotal + " chunks (partial)");
        }
      })();
    }

    function answer(optionId) {
      if (!engine || !engine.currentItem || engine.state.result || transition) return;
      const step = engine.answer(optionId, Date.now() - shownAt);
      const done  = Boolean(engine.state.result);
      transition  = {
        text: done ? "Sonucunu hazırlıyorum." : pickCopy(step),
        done
      };
      syncTrajectory();
      render();
      if (done) logCompletedSession();
      transitionTimer = window.setTimeout(() => {
        transition = null;
        shownAt = Date.now();
        render();
      }, done ? 820 : 680);
    }

    function render() {
      if (transition) {
        app.className = "screen fade";
        app.innerHTML = htmlTransition();
        return;
      }
      if (!engine) {
        app.className = "screen fade";
        app.innerHTML = htmlWelcome();
        return;
      }
      if (engine.state.result) {
        app.className = "screen fade";
        app.innerHTML = htmlResult(engine.state.result);
        return;
      }
      const item    = engine.currentItem;
      const opts    = orderedOptions(item);
      const pct     = Math.min(95, calcProgress());
      app.className = "screen question fade";
      app.innerHTML = `
        <div class="topline">
          <span class="chip">EMİN OLMA YÜZDESİ</span>
          <span>%${pct}</span>
        </div>
        <div class="progress" aria-hidden="true">
          <div class="progress-bar" style="width:${pct}%"></div>
        </div>
        <div class="instruction">${esc(instrFor(item))}</div>
        <div class="prompt">${esc(item.prompt)}</div>
        <div class="choices">
          ${opts.map((o, i) => `
            <button class="choice" style="--i:${i}" data-answer="${esc(o.id)}" type="button">
              <span class="letter">${String.fromCharCode(65 + i)}</span>
              <span class="choice-text">${esc(o.text)}</span>
            </button>
          `).join("")}
        </div>
        <button class="unknown" data-answer="unknown" type="button">Bilmiyorum</button>
        <div style="margin-top: 24px; display: flex; justify-content: center;">
          <button class="unknown" data-action="reset" style="color: #ff6666; border-color: rgba(255,77,77,0.3); min-height: 40px; padding: 0 20px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;" type="button">vazgeç</button>
        </div>
      `;
    }

    function htmlWelcome() {
      return `
        <div class="welcome">
          <span class="chip">ANKA ADAPTIVE ENGINE: CEFR</span>
          <div class="welcome-head">
            <h1><span class="shimmer-text">ADAPTİF SEVİYE TESTİ</span></h1>
            <p>Sadece birkaç dakika sürer. Kişiye göre değişir, seviyenden emin olduğu anda testi bırakır.</p>
          </div>
          <div class="info-list">
            <div class="info-item" style="--i:0">
              <span class="info-dot">1</span>
              <span>Sorular cevaplarına göre seçilir; bazen kolaylaşır, bazen daha ayırt edici olur.</span>
            </div>
            <div class="info-item" style="--i:1">
              <span class="info-dot">2</span>
              <span>Emin değilsen <strong>Bilmiyorum</strong> diyebilirsin. Bu da testin sana uyum sağlamasına yardım eder.</span>
            </div>
            <div class="info-item" style="--i:2">
              <span class="info-dot">3</span>
              <span>Bazı soruların doğru cevaplarıyla birlikte yanlış cevapları da duruma göre değerlendirir. Soruların seçenekleri sizin vereceğiniz tepkilere göre şekillenir.</span>
            </div>
          </div>
        </div>
        <button class="primary pulse" data-action="start" type="button">Başla</button>
      `;
    }

    function htmlTransition() {
      return `
        <div class="transition-screen">
          <div class="thinking-card">
            <div class="thinking-bars" aria-hidden="true">
              <span style="--i:0"></span>
              <span style="--i:1"></span>
              <span style="--i:2"></span>
              <span style="--i:3"></span>
              <span style="--i:4"></span>
            </div>
            <div class="transition-text">${esc(transition.text)}</div>
            <div class="transition-sub">Kısa test akışı devam ediyor.</div>
          </div>
        </div>
      `;
    }

    function htmlResult(result) {
      return `
        <div class="result-screen">
          <div class="topline">
            <span class="result-eyebrow">ÖNERİLEN BAŞLANGIÇ SEVİYEN</span>
          </div>
          <div class="level">${esc(result.estimated_level)}</div>
          <p>Bu test daha çok tanıma becerini ölçer. Konuşma ve yazma ilk günlerde biraz daha düşük hissedebilir.</p>
          <div id="log-status" style="margin-top:6px;font-size:11px;color:rgba(255,255,255,0.35);font-family:SFMono-Regular,Consolas,Menlo,monospace;letter-spacing:0.02em;">build: ${LOG_BUILD} · log: ${lastLogStatus}</div>
        </div>
        <button class="primary" data-action="reset" type="button">Tekrar test et</button>
      `;
    }
    function setLogStatus(msg) {
      lastLogStatus = msg;
      // Try to update the DOM right now. If the indicator isn't mounted yet
      // (race against the 820ms transition screen), the value lives in
      // lastLogStatus and will be picked up next time htmlResult renders.
      const el = document.getElementById("log-status");
      if (el) el.textContent = `build: ${LOG_BUILD} · log: ${msg}`;
    }

    function syncTrajectory() {
      const log = engine?.state?.response_log || [];
      turnPill.textContent = `${log.length} turns`;
      if (!log.length) {
        tBody.innerHTML = `<tr><td colspan="13" class="console-empty">Henüz veri yok.</td></tr>`;
        return;
      }
      tBody.innerHTML = log.map((e) => `
        <tr>
          <td>${e.turn}</td>
          <td><code>${esc(e.item_id)}</code></td>
          <td>${esc(e.boundary)}</td>
          <td>${esc(e.type)}</td>
          <td>${esc(Array.isArray(e.focus) && e.focus.length ? e.focus.join(", ") : "—")}</td>
          <td>${esc(e.selected_option_id || "—")}</td>
          <td>${esc(e.selected_role)}</td>
          <td>${e.correct ? "✓" : "✗"}</td>
          <td>${e.response_ms}</td>
          <td>${esc(e.engine_action)}</td>
          <td>${esc(e.state_before.current_boundary)}</td>
          <td>${esc(e.state_after.current_boundary)}</td>
          <td>${esc(e.state_after.confidence)}</td>
        </tr>
      `).join("");
    }

    /* Helpers */
    function mergedItems() {
      const legacy = content.items || [];
      const diagnostic = (contentV2?.items || []).map((item) => ({
        ...item,
        source_collection: item.source_collection || "diagnostic_v2"
      }));
      return legacy.concat(diagnostic);
    }

    function coreItems() {
      const items = mergedItems().filter((i) =>
        i.source_collection === "diagnostic_v2" || !LEGACY_CORE_EXCLUDED.has(i.type)
      );
      return items.length ? items : mergedItems();
    }

    function pickCopy(step) {
      const turn = engine?.state?.items_asked || 0;
      const sv   = engine?.settings?.seed || "anka";
      const u    = Engine.hashToUnit(`${sv}|transition|${turn}|${step?.logEntry?.item_id || ""}`);
      return TRANSITION_COPY[Math.floor(u * TRANSITION_COPY.length) % TRANSITION_COPY.length];
    }

    function clearTimer() {
      if (transitionTimer) window.clearTimeout(transitionTimer);
      transitionTimer = null;
    }

    function calcProgress() {
      const asked = engine?.state?.items_asked || 0;
      const min   = engine?.settings?.mode === "detailed"
        ? engine.settings.detailedMinItems
        : engine.settings.standardMinItems;
      const conf  = engine?.state?.confidence || "low";
      const boost = conf === "high" ? 18 : conf === "medium" ? 8 : 0;
      return Math.round(Math.min(95, ((asked / Math.max(1, min)) * 72) + boost));
    }

    function orderedOptions(item) {
      return item.options
        .map((o, idx) => ({
          o,
          sort: Engine.hashToUnit(`${engine.settings.seed}|${item.id}|${o.id}|${idx}`)
        }))
        .sort((a, b) => a.sort - b.sort)
        .map((x) => x.o);
    }

    function instrFor(item) {
      // Item type wins. The Turkish prompt language alone does NOT mean
      // it's a vocab/meaning question — naturalness items also have Turkish prompts.
      if (["pragmatic_choice","naturalness_judgment","function","natural_speech","spoken_chunk"].includes(item.type))
        return "En doğal cevabı seç.";
      if (item.type === "discourse_marker") return "Cümledeki ilişkiye uygun bağlacı seç.";
      if (item.type === "vocab" || item.format === "meaning_tr_en") return "Anlamı seç.";
      if (["idiom","collocation","phrasal_verb"].includes(item.type))
        return "Cümleyi doğal tamamlayan ifadeyi seç.";
      return "Boşluğu tamamla.";
    }

    function listText(v) {
      return Array.isArray(v) && v.length ? v.join(", ") : "—";
    }

    function esc(v) {
      return String(v ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[c]));
    }

    /* Event delegation */
    app.addEventListener("click", (e) => {
      if (transition) return;
      const ab = e.target.closest("[data-answer]");
      if (ab) { answer(ab.dataset.answer); return; }
      const ab2 = e.target.closest("[data-action]");
      if (!ab2) return;
      if (ab2.dataset.action === "start")    start("standard");
      if (ab2.dataset.action === "detailed") start("detailed");
      if (ab2.dataset.action === "reset") {
        clearTimer();
        engine = null;
        transition = null;
        render();
        syncTrajectory();
      }
    });

    render();
    syncTrajectory();
  </script>

</body>
</html>
