<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ANKA CEFR Tester — Nektar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Warm academic palette — parchment + ink + ember orange */
      --bg:           #f3ecdc;            /* warm cream paper */
      --bg-soft:      #faf5e9;            /* lighter paper for inner zones */
      --panel:        #ffffff;            /* card surface */
      --panel-soft:   #fbf5ea;            /* secondary card surface */
      --ink:          #1d1a14;            /* near-black, warm */
      --text:         #1d1a14;
      --muted:        #6b665a;            /* warm gray */
      --soft:         #a39d8d;            /* lighter warm gray */
      --accent:       #cc4f00;            /* deeper warm ember (less neon than before) */
      --accent-hot:   #e86510;            /* slight pop for highlights */
      --accent-soft:  #f4a26b;
      --accent-bg:    #fdefe2;            /* very faint orange wash */
      --success:      #4a7a3b;
      --error:        #b94a2a;
      --border:       rgba(29, 26, 20, 0.10);
      --border-strong:rgba(29, 26, 20, 0.16);
      --shadow-sm:    0 1px 3px rgba(29,26,20,0.05);
      --shadow-md:    0 6px 18px rgba(29,26,20,0.07);
      --shadow-lg:    0 18px 45px rgba(29,26,20,0.10);
      --radius-sm:    10px;
      --radius:       18px;
      --radius-lg:    24px;
      --safe-top:     env(safe-area-inset-top, 0px);
      --safe-bottom:  env(safe-area-inset-bottom, 0px);

      /* Fonts */
      --font-sans:    "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-serif:   "Fraunces", Georgia, "Times New Roman", serif;
      --font-display: "Syne", "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      min-height: 100%;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-feature-settings: "ss01", "cv11";
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 15% 12%, rgba(204,79,0,0.05) 0%, transparent 35%),
        radial-gradient(circle at 88% 88%, rgba(75,52,30,0.05) 0%, transparent 40%);
    }

    /* ── Background orbs (legacy — hidden in academic theme) ── */
    .bg-orbs { display: none; }
    .bg-orbs-legacy {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      will-change: transform;
    }

    .bg-orb:nth-child(1) {
      width: 560px; height: 560px;
      background: radial-gradient(circle, rgba(255,122,26,0.22), transparent 70%);
      top: -180px; left: -120px;
      animation: orb1 20s ease-in-out infinite;
    }
    .bg-orb:nth-child(2) {
      width: 440px; height: 440px;
      background: radial-gradient(circle, rgba(255,68,0,0.15), transparent 70%);
      bottom: 10%; right: -100px;
      animation: orb2 26s ease-in-out infinite;
    }
    .bg-orb:nth-child(3) {
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(255,160,60,0.1), transparent 70%);
      top: 45%; left: 35%;
      animation: orb3 32s ease-in-out infinite;
    }

    @keyframes orb1 {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(40px,50px) scale(1.1); }
      66% { transform: translate(-25px,25px) scale(0.93); }
    }
    @keyframes orb2 {
      0%,100% { transform: translate(0,0) scale(1); }
      40% { transform: translate(-50px,-35px) scale(1.12); }
      70% { transform: translate(25px,-55px) scale(0.9); }
    }
    @keyframes orb3 {
      0%,100% { transform: translate(-50%,-50%) scale(1); }
      50% { transform: translate(-50%,calc(-50% - 35px)) scale(1.18); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-orb { animation: none; }
      .typing-live.typing::after { display: none; }
    }

    /* ── Layout ──────────────────────────────────────────── */
    .layout {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
    }

    .app-area {
      flex: 1;
      width: 100%;
      max-width: 480px;
      padding: calc(20px + var(--safe-top)) 16px calc(20px + var(--safe-bottom));
      display: grid;
      align-content: center;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* ── Screen card ─────────────────────────────────────── */
    .screen {
      position: relative;
      min-height: 640px;
      display: grid;
      align-content: center;
      gap: 20px;
      padding: 32px 26px;
      border-radius: var(--radius-lg);
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    /* subtle warm tint in the corner — feels like paper texture */
    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(ellipse at 0% -5%, rgba(204,79,0,0.045), transparent 50%);
      pointer-events: none;
    }

    .screen.question { align-content: start; }

    .screen.fade { animation: fadeUp 320ms cubic-bezier(0.22,1,0.36,1) both; }

    /* ── Topline ─────────────────────────────────────────── */
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--accent-bg);
      border: 1px solid rgba(204, 79, 0, 0.18);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: none;
    }

    .chip::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: dotPulse 2.2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes dotPulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.65); }
    }

    /* Confidence pill: label + value rendered together */
    .confidence-pill {
      gap: 0;
      padding: 0;
      height: auto;
      background: transparent;
      border: 0;
      color: var(--accent-soft);
    }
    .confidence-pill::before { display: none; }
    .confidence-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 28px;
      padding: 0 12px;
      border-radius: 999px 0 0 999px;
      background: var(--accent-bg);
      border: 1px solid rgba(204, 79, 0, 0.18);
      border-right: 0;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .confidence-label::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: dotPulse 2.2s ease-in-out infinite;
      flex-shrink: 0;
    }
    .confidence-value {
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 13px;
      border-radius: 0 999px 999px 0;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    /* ── Progress ────────────────────────────────────────── */
    .progress {
      height: 5px;
      border-radius: 999px;
      background: rgba(29,26,20,0.06);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 420ms cubic-bezier(0.22,1,0.36,1);
    }

    /* ── Typography ──────────────────────────────────────── */
    h1 {
      font-family: var(--font-display);
      font-size: 38px;
      line-height: 1.03;
      font-weight: 800;
      letter-spacing: 0;
      color: var(--ink);
      font-feature-settings: "ss01", "cv11";
    }

    /* Hero title: geometric, steady, and deliberately not animated. */
    .shimmer-text {
      position: relative;
      display: inline;
      color: var(--ink);
      font-style: normal;
      font-weight: 700;
      box-shadow: inset 0 -0.22em rgba(204,79,0,0.20);
    }

    @keyframes caretBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }

    /* ── Welcome ─────────────────────────────────────────── */
    .welcome { display: grid; gap: 30px; }
    .welcome-head { display: grid; gap: 16px; }

    .how-details {
      border-radius: 18px;
      background: rgba(255,255,255,0.52);
      border: 1px solid rgba(29,26,20,0.09);
      box-shadow: 0 10px 28px rgba(29,26,20,0.055);
      overflow: hidden;
    }

    .how-details summary {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 18px;
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      list-style: none;
      -webkit-tap-highlight-color: transparent;
    }

    .how-details summary::-webkit-details-marker { display: none; }

    .how-details summary::after {
      content: "";
      width: 9px;
      height: 9px;
      border-right: 2px solid var(--accent);
      border-bottom: 2px solid var(--accent);
      transform: rotate(45deg) translateY(-2px);
      transition: transform 180ms ease;
      flex-shrink: 0;
    }

    .how-details[open] summary::after {
      transform: rotate(225deg) translateY(-2px);
    }

    .info-list {
      display: grid;
      gap: 14px;
      padding: 0 12px 12px;
    }

    .info-item {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 16px;
      align-items: start;
      padding: 18px 18px 18px 16px;
      border-radius: 16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.72), rgba(251,245,234,0.92));
      border: 1px solid rgba(29,26,20,0.08);
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      box-shadow: 0 8px 22px rgba(29,26,20,0.045);
      transition: border-color 200ms ease, background 200ms ease, transform 180ms ease;
      animation: fadeUp 400ms cubic-bezier(0.22,1,0.36,1) both;
      animation-delay: calc(var(--i,0) * 80ms + 80ms);
    }

    .info-icon {
      width: 38px; height: 38px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #ffffff;
      border: 1px solid rgba(204,79,0,0.16);
      color: var(--accent);
      box-shadow: 0 6px 16px rgba(204,79,0,0.09);
      flex-shrink: 0;
    }

    .info-icon svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
    }

    /* ── Instruction ─────────────────────────────────────── */
    .instruction {
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
      font-style: italic;
    }

    /* ── Prompt ──────────────────────────────────────────── */
    .prompt {
      --prompt-pad-y: 22px;
      --prompt-pad-x: 24px;
      position: relative;
      min-height: 80px;
      display: grid;
      align-items: center;
      padding: var(--prompt-pad-y) var(--prompt-pad-x);
      border-radius: var(--radius);
      background: var(--panel-soft);
      border-left: 4px solid var(--accent);
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 22px;
      line-height: 1.4;
      font-weight: 500;
      font-feature-settings: "ss01";
      animation: fadeUp 320ms cubic-bezier(0.22,1,0.36,1) both;
    }

    .prompt.typewriter-prompt {
      display: block;
    }

    .prompt-ghost {
      display: block;
      visibility: hidden;
    }

    .prompt-live {
      position: absolute;
      inset: var(--prompt-pad-y) var(--prompt-pad-x);
      display: block;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      pointer-events: none;
    }

    .typing-live.typing::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 3px;
      border-radius: 99px;
      background: var(--accent-hot);
      vertical-align: -0.12em;
      animation: caretBlink 520ms steps(1, end) infinite;
    }

    /* ── Choices ─────────────────────────────────────────── */
    .choices { display: grid; gap: 9px; }

    .choice {
      position: relative;
      min-height: 62px;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 12px;
      align-items: center;
      text-align: left;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: #ffffff;
      color: var(--ink);
      box-shadow: var(--shadow-sm);
      transition:
        border-color 180ms ease,
        background 180ms ease,
        transform 120ms cubic-bezier(0.22,1,0.36,1),
        box-shadow 180ms ease;
      animation: choiceIn 320ms cubic-bezier(0.22,1,0.36,1) both;
      animation-delay: calc(var(--i) * 55ms);
      overflow: hidden;
    }

    /* Tap-only feedback (no hover). */
    .choice:active {
      transform: scale(0.99);
      border-color: var(--accent);
      background: var(--accent-bg);
    }

    .letter {
      width: 28px; height: 28px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--accent-bg);
      color: var(--accent);
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .choice-text {
      display: block;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 500;
      color: var(--ink);
      position: relative;
      z-index: 1;
    }

    /* ── Buttons ─────────────────────────────────────────── */
    .primary {
      min-height: 54px;
      border-radius: 14px;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 15px;
      background: var(--accent);
      color: #ffffff;
      letter-spacing: 0.01em;
      transition:
        transform 120ms cubic-bezier(0.22,1,0.36,1),
        box-shadow 180ms ease,
        background 180ms ease;
      box-shadow: var(--shadow-sm), 0 4px 12px rgba(204,79,0,0.18);
      position: relative;
      overflow: hidden;
    }

    .primary:active {
      transform: scale(0.985);
      background: var(--accent-hot);
    }

    .primary.pulse {
      animation: btnPulse 2.8s ease-in-out infinite;
    }

    @keyframes btnPulse {
      0%,100% { box-shadow: var(--shadow-sm), 0 4px 12px rgba(204,79,0,0.18); }
      50%     { box-shadow: var(--shadow-sm), 0 6px 18px rgba(204,79,0,0.32), 0 0 0 5px rgba(204,79,0,0.06); }
    }

    .unknown {
      min-height: 46px;
      border-radius: 12px;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 14px;
      background: transparent;
      color: var(--muted);
      border: 1.5px solid var(--border);
      transition: border-color 180ms ease, color 180ms ease, background 180ms ease;
    }
    .unknown:active {
      background: var(--panel-soft);
      color: var(--ink);
      border-color: var(--border-strong);
    }

    /* ── Transition screen ───────────────────────────────── */
    .transition-screen {
      min-height: 520px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .thinking-card {
      display: grid;
      gap: 22px;
      justify-items: center;
      padding: 36px 24px;
    }

    .thinking-bars {
      display: flex;
      align-items: end;
      gap: 7px;
      height: 52px;
    }

    .thinking-bars span {
      width: 6px;
      border-radius: 999px;
      background: var(--accent);
      animation: barPulse 920ms cubic-bezier(0.45,0.05,0.55,0.95) infinite;
      animation-delay: calc(var(--i) * 115ms);
    }

    .thinking-bars span:nth-child(1) { height: 18px; }
    .thinking-bars span:nth-child(2) { height: 34px; }
    .thinking-bars span:nth-child(3) { height: 26px; }
    .thinking-bars span:nth-child(4) { height: 44px; }
    .thinking-bars span:nth-child(5) { height: 16px; }

    .transition-text {
      max-width: 22ch;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 24px;
      line-height: 1.22;
      font-weight: 500;
    }

    .transition-sub {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      font-style: italic;
    }

    /* ── Result screen ───────────────────────────────────── */
    .result-screen { display: grid; gap: 14px; }

    .result-eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .level {
      font-family: var(--font-serif);
      font-size: 108px;
      line-height: 0.92;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--accent);
      font-feature-settings: "ss01";
      animation: levelReveal 600ms cubic-bezier(0.22,1,0.36,1) both;
      position: relative;
      display: inline-block;
    }

    /* Small accent underline beneath the level letter — feels editorial */
    .level::after {
      content: "";
      display: block;
      width: 56px;
      height: 3px;
      margin-top: 10px;
      background: var(--accent);
      border-radius: 2px;
      animation: fadeUp 600ms ease 300ms both;
    }

    @keyframes levelReveal {
      from { opacity: 0; transform: scale(0.85) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ── Feedback card ──────────────────────────────────── */
    .feedback-card {
      margin-top: 10px;
      padding: 20px 18px;
      border-radius: var(--radius);
      background: var(--panel-soft);
      border: 1px solid var(--border);
      display: grid;
      gap: 14px;
    }
    .feedback-q {
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 500;
      line-height: 1.35;
    }
    .feedback-opts {
      display: grid;
      gap: 8px;
    }
    .feedback-opt {
      min-height: 46px;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #ffffff;
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      line-height: 1.35;
      transition: border-color 160ms ease, background 160ms ease;
    }
    .feedback-opt:active {
      border-color: var(--accent);
      background: var(--accent-bg);
    }
    .feedback-opt.selected {
      border-color: var(--accent);
      background: var(--accent-bg);
      color: var(--accent);
      font-weight: 600;
    }
    .feedback-label {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0;
      font-style: italic;
    }
    .feedback-input {
      width: 100%;
      min-height: 76px;
      max-height: 200px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
      box-sizing: border-box;
    }
    .feedback-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .feedback-submit {
      min-height: 44px !important;
      font-size: 14px !important;
    }
    .feedback-submit:disabled {
      opacity: 0.6;
      filter: grayscale(0.3);
      cursor: not-allowed;
    }
    .feedback-status {
      min-height: 16px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
    .feedback-status.ok  { color: var(--success); }
    .feedback-status.err { color: var(--error); }
    .feedback-card.submitted .feedback-opt:not(.selected) { opacity: 0.35; }
    .feedback-card.submitted .feedback-opt,
    .feedback-card.submitted .feedback-input,
    .feedback-card.submitted .feedback-submit {
      pointer-events: none;
    }

    /* ── Core keyframes ──────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes choiceIn {
      from { opacity: 0; transform: translateY(9px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes barPulse {
      0%,100% { transform: scaleY(0.5); opacity: 0.45; }
      50%     { transform: scaleY(1);   opacity: 1; }
    }

    /* ── Mobile ──────────────────────────────────────────── */
    @media (max-width: 500px) {
      .app-area {
        padding: var(--safe-top) 12px 0;
        align-content: start;
      }
      .screen {
        min-height: calc(100dvh - 24px);
        margin: 12px 0;
        border-radius: var(--radius-lg);
        padding: 28px 22px;
      }
      h1 { font-size: 32px; }
      .prompt {
        --prompt-pad-y: 20px;
        --prompt-pad-x: 20px;
        font-size: 19px;
      }
      .choice-text { font-size: 15px; }
      .level { font-size: 88px; }
    }

    /* ── Trajectory console ──────────────────────────────── */
    .console-wrapper {
      width: 100%;
      max-width: 1100px;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;

    .console-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      padding: 9px 18px;
      letter-spacing: 0.06em;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(4px);
      transition: all 180ms ease;
      box-shadow: var(--shadow-sm);

    .console-toggle-btn:active {
      border-color: var(--border-strong);
      color: var(--ink);
      background: #ffffff;
      transform: scale(0.98);
    }

    .console-toggle-btn svg {
      flex-shrink: 0;
      transition: transform 240ms cubic-bezier(0.22,1,0.36,1);
    }

    .console-toggle-btn.open svg { transform: rotate(180deg); }

    /* The console intentionally stays dark/code-y — it's a power-user
       debug surface, and the contrast against the warm light app helps
       visually classify it as "tool" vs "test". */
    .console-panel {
      width: 100%;
      background: #1a1814;
      border: 1px solid #2b2620;
      border-radius: 14px;
      overflow: hidden;
      display: none;
      box-shadow: var(--shadow-md);

    .console-panel.visible {

      border-bottom: 1px solid #2b2620;

    .console-title {
      font-size: 12px;
      font-weight: 700;

    .turn-pill {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255,165,75,0.12);

    .table-scroll {

    .console-table {

    .console-table td {
      padding: 7px 10px;
      color: rgba(232,226,210,0.78);
      border-bottom: 1px solid rgba(232,226,210,0.06);

    }

    .console-table th {
      padding: 8px 10px;
      text-align: left;
      color: rgba(232,226,210,0.5);
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(232,226,210,0.08);
    }

    .console-table tr:last-child td { border-bottom: 0; }

    .console-table code {
      background: rgba(255,165,75,0.08);
      color: #ffb36f;

    .console-empty {
      padding: 22px;
      text-align: center;

    /* ── Footer ──────────────────────────────────────────── */

      opacity: 1;
      filter: contrast(1.18) saturate(1.08) drop-shadow(0 5px 14px rgba(29,26,20,0.12));
    }
  </style>
</head>
<body>

  <div class="bg-orbs" aria-hidden="true">
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
  </div>

  <div class="layout">

    <div class="app-area">
      <section id="app" class="screen"></section>
    </div>

    <div class="console-wrapper">
      <button class="console-toggle-btn" id="console-toggle" type="button">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3 5 7 9 11 5"/>
        </svg>
        <span id="console-label">KAYIT DEFTERİNİ GÖSTER</span>
      </button>

      <div class="console-panel" id="console-panel">
        <div class="console-head">
          <span class="console-title">TRAJECTORY</span>
          <span class="turn-pill" id="turn-pill">0 turns</span>
        </div>
        <div class="table-scroll">
          <table class="console-table">
            <thead>
              <tr>
                <th>Turn</th>
                <th>Item</th>
                <th>Boundary</th>
                <th>Type</th>
                <th>Focus</th>
                <th>Selected</th>
                <th>Role</th>
                <th>Correct</th>
                <th>MS</th>
                <th>Action</th>
                <th>Before</th>
                <th>After</th>
                <th>Confidence</th>
              </tr>
            </thead>
            <tbody id="trajectory-body">
              <tr><td colspan="13" class="console-empty">Henüz veri yok.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <img class="footer-logo" src="./loading_dark.png" alt="Nektar Logo">
        <span>NEKTAR Lab: ANKA CEFR Tester Beta / 2026 all rights reserved</span>
      </div>
    </footer>

  </div>

  <script src="./placement-questions.js"></script>
  <script src="./placement-pool.generated.js"></script>
  <script src="./placement-questions-v2.js"></script>
  <script src="./ceiling-probe-engine.js"></script>
  <script>
    const Engine  = window.NektarCeilingProbeEngine;
    const content = window.NEKTAR_PLACEMENT_CONTENT;
    const contentV2 = window.NEKTAR_PLACEMENT_CONTENT_V2;
    const app     = document.getElementById("app");

    /* Console toggle */
    const consoleToggle = document.getElementById("console-toggle");
    const consolePanel  = document.getElementById("console-panel");
    const consoleLabel  = document.getElementById("console-label");
    const turnPill      = document.getElementById("turn-pill");
    const tBody         = document.getElementById("trajectory-body");
    let consoleOpen = true;

    // Initialize console state
    if (consoleOpen) {
      consolePanel.classList.add("visible");
      consoleToggle.classList.add("open");
      consoleLabel.textContent = "KAYIT DEFTERİNİ GİZLE";
    }

    consoleToggle.addEventListener("click", () => {
      consoleOpen = !consoleOpen;
      consolePanel.classList.toggle("visible", consoleOpen);
      consoleToggle.classList.toggle("open", consoleOpen);
      consoleLabel.textContent = consoleOpen ? "KAYIT DEFTERİNİ GİZLE" : "KAYIT DEFTERİNİ GÖSTER";
    });

    /* Engine state */
    // LEGACY_CORE_EXCLUDED only filters items WITHOUT source_collection === "diagnostic_v2".
    // Codex v2 items bypass this filter entirely.
    //
    // Audit (CODEX_BRIEF.md context):
    //  - naturalness_judgment: 7 legacy items, all clean → ENABLED
    //  - pragmatic_choice: 8 legacy items, all have "You are at..." scaffolding bug → kept off,
    //    Codex v2 will deliver 40 fresh pragmatic_choice items
    //  - function / natural_speech / spoken_chunk: design overlap or require audio → kept off
    const LEGACY_CORE_EXCLUDED = new Set([
      "function", "pragmatic_choice", "natural_speech", "spoken_chunk"
    ]);

    const TRANSITION_COPY = [
      "Cevabın kaydedildi.",
      "Bir sonraki soruyu seçiyorum.",
      "Bir sonraki sorunun zorluğunu ayarlıyorum.",
      "Hmm... sıradaki maddeyi hazırlıyorum.",
      "Tamam, şimdi sonraki soruya geçiyoruz.",
      "Kısa bir kontrol daha yapıyorum.",
      "Akışı cevabına göre güncelliyorum.",
      "Sıradaki soru hazırlanıyor.",
      "Bir sonraki maddeyi seçiyorum.",
      "Sonucunu netleştirmek için devam ediyoruz."
    ];

    let engine  = null;
    let shownAt = 0;
    let transition = null;
    let transitionTimer = null;
    let promptTypingTimer = null;

    function seed() {
      const s = new URLSearchParams(location.search).get("seed");
      return s || `anka-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    let sessionStartedAt = null;
    let loggedSessionIds = new Set();

    function start(mode = "standard") {
      clearTimer();
      engine = Engine.createEngine(coreItems(), {
        seed: seed(),
        mode,
        startBoundary: "A1/A2",
        standardMinItems: 8,
        detailedMinItems: 14,
        maxItems: mode === "detailed" ? 28 : 24
      });
      shownAt = Date.now();
      sessionStartedAt = Date.now();
      transition = null;
      lastLogStatus = "waiting";   // reset for the new session
      render();
      syncTrajectory();
    }

    // Logging build tag — bump this to force cache busting on the phone.
    const LOG_BUILD = "v14-2026-05-16-academic-theme";
    // Endpoint URL — content blockers (1Blocker, AdGuard) often kill anything
    // matching "/log" patterns. Use a neutral name.
    const LOG_ENDPOINT = "/api/record";
    // Latest log status — stored so the indicator survives the render race
    // between transition→result screens.
    let lastLogStatus = "waiting";

    function logCompletedSession() {
      if (!engine || !engine.state.result) return;
      const sid = engine.settings.seed;
      if (loggedSessionIds.has(sid)) return;
      loggedSessionIds.add(sid);
      const payload = {
        session_id: sid,
        log_build: LOG_BUILD,
        started_at: new Date(sessionStartedAt || Date.now()).toISOString(),
        ended_at: new Date().toISOString(),
        duration_ms: Date.now() - (sessionStartedAt || Date.now()),
        user_agent: navigator.userAgent,
        device: {
          screen_w: screen.width,
          screen_h: screen.height,
          dpr: window.devicePixelRatio || 1,
          lang: navigator.language,
          platform: navigator.platform || "",
          timezone: (Intl.DateTimeFormat().resolvedOptions().timeZone) || "",
          referrer: document.referrer || ""
        },
        mode: engine.settings.mode,
        result: engine.state.result,
        items_asked: engine.state.items_asked,
        confidence_at_end: engine.state.confidence,
        trajectory: engine.state.response_log
      };
      const body = JSON.stringify(payload);

      console.log("[log " + LOG_BUILD + "] firing for", sid, "size:", body.length);
      const showStatus = (m) => { try { setLogStatus(m); } catch {} };
      setTimeout(() => showStatus("sending…"), 100);

      let settled = false;
      const finish = (msg) => { if (!settled) { settled = true; showStatus(msg); } };

      // --- MEDIUM-sized GET payload (everything except trajectory) ---
      // Uses real field names so the admin can render rows properly.
      // Trajectory is dropped here because it doesn't fit under most mobile
      // URL filters (~2-4KB). A separate POST attempt may still deliver it.
      const meta = {
        session_id: sid,
        log_build: LOG_BUILD,
        started_at: payload.started_at,
        ended_at: payload.ended_at,
        duration_ms: payload.duration_ms,
        mode: payload.mode,
        items_asked: payload.items_asked,
        confidence_at_end: payload.confidence_at_end,
        result: payload.result,                   // full result object
        user_agent: (navigator.userAgent || "").slice(0, 300),
        device: payload.device,                   // full device fingerprint
        partial: true                              // marker: trajectory missing
      };
      const tinyBody = JSON.stringify(meta);
      const tinyUrl = LOG_ENDPOINT + "?d=" + encodeURIComponent(tinyBody);
      console.log("[log] meta URL length:", tinyUrl.length);

      // --- (1) Tiny GET — should pass any URL-length filter ---
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 8000);
        fetch(tinyUrl, { method: "GET", signal: ctrl.signal })
          .then(async (r) => {
            clearTimeout(t);
            if (r.ok) finish("✓ sent via tiny-GET (" + tinyBody.length + "B)");
            else if (!settled) finish("tiny-GET error " + r.status);
          })
          .catch((e) => {
            clearTimeout(t);
            console.warn("[log] tiny-GET failed:", e);
            if (!settled) finish("tiny-GET failed: " + String(e?.message || e).slice(0, 40));
          });
      } catch (e) { console.warn("[log] tiny-GET setup threw:", e); }

      // --- (2) sendBeacon w/ full body (background, best-effort) ---
      try {
        if (navigator.sendBeacon) {
          const blob = new Blob([body], { type: "application/json" });
          navigator.sendBeacon(LOG_ENDPOINT, blob);
        }
      } catch (e) { console.warn("[log] sendBeacon threw:", e); }

      // --- (3) Full POST in parallel — if filter doesn't block it, full
      //         trajectory overwrites the tiny record (same session_id). ---
      try {
        const postCtrl = new AbortController();
        const postT = setTimeout(() => postCtrl.abort(), 6000);
        fetch(LOG_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body,
          keepalive: true,
          signal: postCtrl.signal
        }).then(async (r) => {
          clearTimeout(postT);
          if (r.ok && !settled) finish("✓ sent via POST (" + body.length + "B)");
        }).catch(() => { /* silent — tiny-GET path is the safety net */ });
      } catch (e) { console.warn("[log] POST setup threw:", e); }

      // --- (4) Trajectory chunks via sequential GETs ---
      // We fire chunks one-at-a-time with a small delay to dodge mobile
      // rate-limiting/connection-throttling. Each chunk lives in its own
      // blob path so they never race-overwrite each other.
      // Each turn carries prompt + selected text so the admin can show the
      // actual question content and the engine's action.
      const traj = payload.trajectory || [];
      const allItems = ((content && content.items) || []).concat((contentV2 && contentV2.items) || []);
      const itemById = new Map(allItems.map((it) => [it.id, it]));
      const enrichTurn = (e) => {
        const it = itemById.get(e.item_id);
        let promptText = "";
        let selectedText = "";
        if (it) {
          promptText = (it.prompt || "").slice(0, 90);
          const opt = (it.options || []).find((o) => o.id === e.selected_option_id);
          if (opt) selectedText = (opt.text || "").slice(0, 60);
        }
        return {
          t: e.turn,
          item_id: e.item_id,
          boundary: e.boundary,
          type: e.type,
          focus: e.focus || [],
          prompt: promptText,
          selected_option_id: e.selected_option_id,
          selected_text: selectedText,
          selected_role: e.selected_role,
          correct: e.correct,
          response_ms: e.response_ms,
          engine_action: e.engine_action,
          movement_reason: (e.movement_reason || "").slice(0, 100),
          state_after_boundary: e.state_after?.current_boundary,
          state_after_confidence: e.state_after?.confidence
        };
      };

      const CHUNK_SIZE = 2;
      const chunkTotal = Math.ceil(traj.length / CHUNK_SIZE);
      let chunkSuccess = 0;
      (async () => {
        for (let i = 0; i < traj.length; i += CHUNK_SIZE) {
          const idx = Math.floor(i / CHUNK_SIZE);
          const chunkBody = {
            session_id: sid,
            chunk_index: idx,
            chunk_total: chunkTotal,
            log_build: LOG_BUILD,
            turns: traj.slice(i, i + CHUNK_SIZE).map(enrichTurn)
          };
          const cBody = JSON.stringify(chunkBody);
          const cUrl = LOG_ENDPOINT + "?d=" + encodeURIComponent(cBody);
          try {
            const r = await fetch(cUrl, { method: "GET" });
            if (r.ok) {
              chunkSuccess++;
              console.log("[log] chunk", idx, "/", chunkTotal, "ok (url", cUrl.length, ")");
              showStatus("✓ meta + " + chunkSuccess + "/" + chunkTotal + " chunks");
            } else {
              console.warn("[log] chunk", idx, "error", r.status);
            }
          } catch (e) {
            console.warn("[log] chunk", idx, "failed:", e);
          }
          // Tiny delay so we don't trigger carrier-side rate limits.
          await new Promise((r) => setTimeout(r, 150));
        }
        if (chunkSuccess < chunkTotal) {
          showStatus("✓ meta + " + chunkSuccess + "/" + chunkTotal + " chunks (partial)");
        }
      })();
    }

    function answer(optionId) {
      if (!engine || !engine.currentItem || engine.state.result || transition) return;
      clearPromptTyping();
      const step = engine.answer(optionId, Date.now() - shownAt);
      const done  = Boolean(engine.state.result);
      transition  = {
        text: done ? "Sonucunu hazırlıyorum." : pickCopy(step),
        done
      };
      syncTrajectory();
      render();
      if (done) logCompletedSession();
      transitionTimer = window.setTimeout(() => {
        transition = null;
        shownAt = Date.now();
        render();
      }, done ? 820 : 680);
    }

    function render() {
      if (transition) {
        app.className = "screen fade";
        app.innerHTML = htmlTransition();
        return;
      }
      if (!engine) {
        app.className = "screen fade";
        app.innerHTML = htmlWelcome();
        return;
      }
      if (engine.state.result) {
        app.className = "screen fade";
        app.innerHTML = htmlResult(engine.state.result);
        return;
      }
      const item    = engine.currentItem;
      const opts    = orderedOptions(item);
      const pct     = Math.min(95, calcProgress());
      app.className = "screen question fade";
      app.innerHTML = `
        <div class="topline">
          <span class="chip confidence-pill">
            <span class="confidence-label">EMİN OLMA YÜZDESİ</span>
            <span class="confidence-value">%${pct}</span>
          </span>
        </div>
        <div class="progress" aria-hidden="true">
          <div class="progress-bar" style="width:${pct}%"></div>
        </div>
        <div class="instruction">${esc(instrFor(item))}</div>
        <div class="prompt typewriter-prompt" aria-label="${esc(item.prompt)}">
          <span class="prompt-ghost" aria-hidden="true">${esc(item.prompt)}</span>
          <span class="prompt-live typing-live" data-typewriter-prompt aria-hidden="true">${esc(item.prompt)}</span>
        </div>
        <div class="choices">
          ${opts.map((o, i) => `
            <button class="choice" style="--i:${i}" data-answer="${esc(o.id)}" aria-label="${String.fromCharCode(65 + i)}. ${esc(o.text)}" type="button">
              <span class="letter">${String.fromCharCode(65 + i)}</span>
              <span class="choice-text">${esc(o.text)}</span>
            </button>
          `).join("")}
        </div>
        <button class="unknown" data-answer="unknown" type="button">Bilmiyorum</button>
        <div style="margin-top: 24px; display: flex; justify-content: center;">
          <button class="unknown" data-action="reset" style="color: var(--error); border-color: rgba(185,74,42,0.3); min-height: 40px; padding: 0 22px; font-size: 12px; letter-spacing: 0.04em;" type="button">vazgeç</button>
        </div>
      `;
      startPromptTypewriter(item.prompt);
    }

    function htmlWelcome() {
      return `
        <div class="welcome">
          <span class="chip">ANKA ADAPTIVE ENGINE: CEFR</span>
          <div class="welcome-head">
            <h1><span class="shimmer-text">ADAPTİF SEVİYE TESTİ</span></h1>
            <p>Sadece birkaç dakika sürer. Kişiye göre değişir, seviyenden emin olduğu anda testi bırakır.</p>
          </div>
          <details class="how-details">
            <summary>Nasıl çalışır?</summary>
            <div class="info-list">
              <div class="info-item" style="--i:0">
                <span class="info-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 6h5"></path><path d="M15 6h5"></path><path d="M9 6c4 0 2 12 6 12"></path><path d="M15 18h5"></path><path d="M4 18h5"></path>
                  </svg>
                </span>
                <span>Sorular cevaplarına göre seçilir; bazen kolaylaşır, bazen daha ayırt edici olur.</span>
              </div>
              <div class="info-item" style="--i:1">
                <span class="info-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3a9 9 0 1 0 9 9"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path><path d="M17 4l4 4"></path>
                  </svg>
                </span>
                <span>Emin değilsen <strong>Bilmiyorum</strong> diyebilirsin. Bu da testin sana uyum sağlamasına yardım eder.</span>
              </div>
              <div class="info-item" style="--i:2">
                <span class="info-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 18h16"></path><path d="M6 14l4-4 3 3 5-7"></path><path d="M18 6h-4"></path><path d="M18 6v4"></path>
                  </svg>
                </span>
                <span>Bazı soruların doğru cevaplarıyla birlikte yanlış cevapları da duruma göre değerlendirir. Soruların seçenekleri sizin vereceğiniz tepkilere göre şekillenir.</span>
              </div>
            </div>
          </details>
        </div>
        <button class="primary pulse" data-action="start" type="button">Başla</button>
      `;
    }

    function htmlTransition() {
      return `
        <div class="transition-screen">
          <div class="thinking-card">
            <div class="thinking-bars" aria-hidden="true">
              <span style="--i:0"></span>
              <span style="--i:1"></span>
              <span style="--i:2"></span>
              <span style="--i:3"></span>
              <span style="--i:4"></span>
            </div>
            <div class="transition-text">${esc(transition.text)}</div>
            <div class="transition-sub">Kısa test akışı devam ediyor.</div>
          </div>
        </div>
      `;
    }

    function htmlResult(result) {
      return `
        <div class="result-screen">
          <div class="topline">
            <span class="result-eyebrow">ÖNERİLEN BAŞLANGIÇ SEVİYEN</span>
          </div>
          <div class="level">${esc(result.estimated_level)}</div>
          <p>Bu test daha çok tanıma becerini ölçer. Konuşma ve yazma ilk günlerde biraz daha düşük hissedebilir.</p>

          <div class="feedback-card">
            <div class="feedback-q">Sizce test ne kadar isabetli tahmin yaptı?</div>
            <div class="feedback-opts">
              <button class="feedback-opt" data-feedback="accurate" type="button">Yeterince isabetliydi</button>
              <button class="feedback-opt" data-feedback="needs_work" type="button">Pek isabetli değildi, geliştirilmeli</button>
              <button class="feedback-opt" data-feedback="wrong" type="button">Tamamen yanlış bildi</button>
            </div>
            <label class="feedback-label" for="feedback-comment">İletmek istediğiniz görüşünüz varsa bize yazın:</label>
            <textarea id="feedback-comment" class="feedback-input" rows="3" maxlength="800" placeholder="(isteğe bağlı)"></textarea>
            <button class="primary feedback-submit" id="feedback-submit" type="button">Gönder</button>
            <div class="feedback-status" id="feedback-status"></div>
          </div>

          <div id="log-status" style="margin-top:6px;font-size:11px;color:rgba(29,26,20,0.35);font-family:SFMono-Regular,Consolas,Menlo,monospace;letter-spacing:0.02em;">build: ${LOG_BUILD} · log: ${lastLogStatus}</div>
        </div>
        <button class="primary" data-action="reset" type="button">Tekrar test et</button>
      `;
    }
    function setLogStatus(msg) {
      lastLogStatus = msg;
      // Try to update the DOM right now. If the indicator isn't mounted yet
      // (race against the 820ms transition screen), the value lives in
      // lastLogStatus and will be picked up next time htmlResult renders.
      const el = document.getElementById("log-status");
      if (el) el.textContent = `build: ${LOG_BUILD} · log: ${msg}`;
    }

    function syncTrajectory() {
      const log = engine?.state?.response_log || [];
      turnPill.textContent = `${log.length} turns`;
      if (!log.length) {
        tBody.innerHTML = `<tr><td colspan="13" class="console-empty">Henüz veri yok.</td></tr>`;
        return;
      }
      tBody.innerHTML = log.map((e) => `
        <tr>
          <td>${e.turn}</td>
          <td><code>${esc(e.item_id)}</code></td>
          <td>${esc(e.boundary)}</td>
          <td>${esc(e.type)}</td>
          <td>${esc(Array.isArray(e.focus) && e.focus.length ? e.focus.join(", ") : "—")}</td>
          <td>${esc(e.selected_option_id || "—")}</td>
          <td>${esc(e.selected_role)}</td>
          <td>${e.correct ? "✓" : "✗"}</td>
          <td>${e.response_ms}</td>
          <td>${esc(e.engine_action)}</td>
          <td>${esc(e.state_before.current_boundary)}</td>
          <td>${esc(e.state_after.current_boundary)}</td>
          <td>${esc(e.state_after.confidence)}</td>
        </tr>
      `).join("");
    }

    /* Helpers */
    function mergedItems() {
      const legacy = content.items || [];
      const diagnostic = (contentV2?.items || []).map((item) => ({
        ...item,
        source_collection: item.source_collection || "diagnostic_v2"
      }));
      return legacy.concat(diagnostic);
    }

    function coreItems() {
      const items = mergedItems().filter((i) =>
        i.source_collection === "diagnostic_v2" || !LEGACY_CORE_EXCLUDED.has(i.type)
      );
      return items.length ? items : mergedItems();
    }

    function pickCopy(step) {
      const turn = engine?.state?.items_asked || 0;
      const sv   = engine?.settings?.seed || "anka";
      const u    = Engine.hashToUnit(`${sv}|transition|${turn}|${step?.logEntry?.item_id || ""}`);
      return TRANSITION_COPY[Math.floor(u * TRANSITION_COPY.length) % TRANSITION_COPY.length];
    }

    function clearTimer() {
      if (transitionTimer) window.clearTimeout(transitionTimer);
      transitionTimer = null;
      clearPromptTyping();
    }

    function clearPromptTyping() {
      if (promptTypingTimer) window.clearTimeout(promptTypingTimer);
      promptTypingTimer = null;
    }

    function startPromptTypewriter(promptText) {
      if (promptTypingTimer) window.clearTimeout(promptTypingTimer);
      promptTypingTimer = null;

      const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const promptLive = app.querySelector("[data-typewriter-prompt]");
      if (promptLive) typeInto(promptLive, promptText, { reduced, delay: 80, stepMs: 18 });
    }

    function typeInto(live, text, config = {}) {
      if (!live) return;

      const full = String(text ?? "");
      const reduced = Boolean(config.reduced);
      if (reduced || full.length < 2) {
        live.textContent = full;
        live.classList.remove("typing");
        return;
      }

      live.textContent = "";
      live.classList.add("typing");

      let i = 0;
      const stepSize = config.stepSize || (full.length > 150 ? 5 : full.length > 90 ? 4 : 3);
      const step = () => {
        i = Math.min(full.length, i + stepSize);
        live.textContent = full.slice(0, i);
        if (i >= full.length) {
          live.classList.remove("typing");
          return;
        }
        const timer = window.setTimeout(step, config.stepMs || 18);
        promptTypingTimer = timer;
      };
      const timer = window.setTimeout(step, config.delay || 0);
      promptTypingTimer = timer;
    }

    function calcProgress() {
      const asked = engine?.state?.items_asked || 0;
      const min   = engine?.settings?.mode === "detailed"
        ? engine.settings.detailedMinItems
        : engine.settings.standardMinItems;
      const conf  = engine?.state?.confidence || "low";
      const boost = conf === "high" ? 18 : conf === "medium" ? 8 : 0;
      return Math.round(Math.min(95, ((asked / Math.max(1, min)) * 72) + boost));
    }

    function orderedOptions(item) {
      return item.options
        .map((o, idx) => ({
          o,
          sort: Engine.hashToUnit(`${engine.settings.seed}|${item.id}|${o.id}|${idx}`)
        }))
        .sort((a, b) => a.sort - b.sort)
        .map((x) => x.o);
    }

    function instrFor(item) {
      // Item type wins. The Turkish prompt language alone does NOT mean
      // it's a vocab/meaning question — naturalness items also have Turkish prompts.
      if (["pragmatic_choice","naturalness_judgment","function","natural_speech","spoken_chunk"].includes(item.type))
        return "En doğal cevabı seç.";
      if (item.type === "discourse_marker") return "Cümledeki ilişkiye uygun bağlacı seç.";
      if (item.type === "vocab" || item.format === "meaning_tr_en") return "Anlamı seç.";
      if (["idiom","collocation","phrasal_verb"].includes(item.type))
        return "Cümleyi doğal tamamlayan ifadeyi seç.";
      return "Boşluğu tamamla.";
    }

    function listText(v) {
      return Array.isArray(v) && v.length ? v.join(", ") : "—";
    }

    function esc(v) {
      return String(v ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[c]));
    }

    /* Event delegation */
    // ── Feedback state + handlers ───────────────────────────────────
    let selectedFeedback = null;
    function sendFeedback(sid) {
      const commentEl = document.getElementById("feedback-comment");
      const statusEl  = document.getElementById("feedback-status");
      const cardEl    = document.querySelector(".feedback-card");
      const submitBtn = document.getElementById("feedback-submit");
      const comment = ((commentEl && commentEl.value) || "").slice(0, 800);
      if (!selectedFeedback && !comment) {
        if (statusEl) { statusEl.textContent = "Lütfen bir seçenek seç veya yorum yaz."; statusEl.className = "feedback-status err"; }
        return;
      }
      if (statusEl) { statusEl.textContent = "Gönderiliyor…"; statusEl.className = "feedback-status"; }
      if (submitBtn) submitBtn.disabled = true;
      const payload = {
        session_id: sid,
        log_build: LOG_BUILD,
        feedback: {
          accuracy_rating: selectedFeedback,
          comment,
          submitted_at: new Date().toISOString()
        }
      };
      const url = LOG_ENDPOINT + "?d=" + encodeURIComponent(JSON.stringify(payload));
      fetch(url, { method: "GET" })
        .then((r) => {
          if (r.ok) {
            if (statusEl) { statusEl.textContent = "✓ Teşekkürler!"; statusEl.className = "feedback-status ok"; }
            if (cardEl) cardEl.classList.add("submitted");
          } else {
            if (statusEl) { statusEl.textContent = "Gönderilemedi (" + r.status + ")"; statusEl.className = "feedback-status err"; }
            if (submitBtn) submitBtn.disabled = false;
          }
        })
        .catch((e) => {
          if (statusEl) { statusEl.textContent = "Ağ hatası: " + String(e?.message || e).slice(0, 40); statusEl.className = "feedback-status err"; }
          if (submitBtn) submitBtn.disabled = false;
        });
    }

    app.addEventListener("click", (e) => {
      if (transition) return;
      // Feedback rating buttons
      const fbBtn = e.target.closest("[data-feedback]");
      if (fbBtn) {
        selectedFeedback = fbBtn.dataset.feedback;
        document.querySelectorAll(".feedback-opt").forEach((b) => b.classList.toggle("selected", b === fbBtn));
        return;
      }
      // Feedback submit
      if (e.target.closest("#feedback-submit")) {
        const sid = engine?.settings?.seed || "no-session";
        sendFeedback(sid);
        return;
      }
      const ab = e.target.closest("[data-answer]");
      if (ab) { answer(ab.dataset.answer); return; }
      const ab2 = e.target.closest("[data-action]");
      if (!ab2) return;
      if (ab2.dataset.action === "start")    start("standard");
      if (ab2.dataset.action === "detailed") start("detailed");
      if (ab2.dataset.action === "reset") {
        clearTimer();
        engine = null;
        transition = null;
        selectedFeedback = null;
        render();
        syncTrajectory();
      }
    });

    render();
    syncTrajectory();
  </script>

</body>
</html>
